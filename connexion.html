<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Bébé - Connexion & Inscription</title>
</head>
<body>

    <div class="card">
        <!-- Logo officiel -->
        <div class="logo-container">
            <div class="logo-wrapper">
                <img src="https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png" alt="Logo Love Bébé" crossorigin="anonymous">
            </div>
        </div>

        <h2 id="form-title">Connexion Love Bébé</h2>

        <!-- FORMULAIRE DE CONNEXION -->
        <form id="loginForm">
            <label>Email :</label>
            <input type="email" id="loginEmail" required placeholder="exemple@domaine.com">

            <label>Mot de passe :</label>
            <div class="password-container">
                <input type="password" id="loginPassword" required placeholder="••••••••">
                <span class="toggle-password" onclick="togglePasswordVisibility('loginPassword', this)">👁️</span>
            </div>

            <button type="submit">Se connecter</button>
            <div id="loginError" class="error-msg"></div>
        </form>

        <!-- FORMULAIRE D'INSCRIPTION -->
        <form id="registerForm" class="hidden">
            <label>Nom complet (sur la Carte d'Identité) :</label>
            <input type="text" id="fullName" placeholder="Ex: Kouassi Jean">

            <label>Ville :</label>
            <input type="text" id="city" placeholder="Ex: Abidjan">

            <label>Pays :</label>
            <select id="countrySelect">
                <option value="">Sélectionnez votre pays</option>
            </select>

            <label>Département :</label>
            <input type="text" id="department" placeholder="Ex: Plateau">

            <label>Âge (Minimum 16 ans) :</label>
            <input type="number" id="age" min="16" placeholder="Votre âge">

            <label>Âge recherché (Ame sœur) :</label>
            <select id="targetAge">
                <option value="">Sélectionnez une tranche d'âge</option>
                <option value="18-25">18 - 25 ans</option>
                <option value="25-30">25 - 30 ans</option>
                <option value="30-35">30 - 35 ans</option>
                <option value="35-40">35 - 40 ans</option>
                <option value="40-45">40 - 45 ans</option>
                <option value="45-50">45 - 50 ans</option>
                <option value="50-55">50 - 55 ans</option>
                <option value="55+">Plus de 55 ans</option>
            </select>

            <label>Ame sœur / Type de relation :</label>
            <select id="soulMateType">
                <option value="">Que recherchez-vous ?</option>
                <option value="Mariage sérieux">Mariage sérieux</option>
                <option value="Relation durable">Relation durable</option>
                <option value="Amitié et amour">Amitié et amour</option>
            </select>

            <label>Nationalité / Recherche :</label>
            <input type="text" id="nationalitySearch" placeholder="Ex: Ivoirienne / Sérieuse">

            <label>Numéro de téléphone :</label>
            <div class="phone-group">
                <select id="countryCode">
                    <option value="+225">+225 (Côte d'Ivoire)</option>
                    <option value="+33">+33 (France)</option>
                    <option value="+237">+237 (Cameroun)</option>
                    <option value="+221">+221 (Sénégal)</option>
                    <option value="+1">+1 (USA/Canada)</option>
                    <option value="+229">+229 (Bénin)</option>
                </select>
                <input type="tel" id="phoneNumber" placeholder="0102030405">
            </div>

            <label>Email :</label>
            <input type="email" id="regEmail" placeholder="exemple@domaine.com">

            <label>Mot de passe :</label>
            <div class="password-container">
                <input type="password" id="regPassword" placeholder="••••••••">
                <span class="toggle-password" onclick="togglePasswordVisibility('regPassword', this)">👁️</span>
            </div>

            <label>Photo de profil (Galerie) :</label>
            <input type="file" id="profileImage" accept="image/*,video/*">

            <button type="submit">S'inscrire</button>
            <div id="regError" class="error-msg"></div>
        </form>

        <!-- Bascule -->
        <div class="switch-link">
            <span id="toggleTextMsg">Pas encore de compte ?</span> <span id="toggleBtn">S'inscrire</span>
        </div>
    </div>

    <!-- Script de Visibilité du mot de passe -->
    <script>
        function togglePasswordVisibility(fieldId, iconElement) {
            const field = document.getElementById(fieldId);
            if (field.type === "password") {
                field.type = "text";
                iconElement.textContent = "🙈";
            } else {
                field.type = "password";
                iconElement.textContent = "👁️";
            }
        }
    </script>

    <!-- Script d'Intégration Firebase + Cloudinary + Admin -->
    <script type="module">
        import { auth, uploadMediaToCloudinary, checkAdminAndRedirect, rtdb } from "./love-bebe-service.js";
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { ref, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Chargement automatique de la liste mondiale des pays
        async function loadCountries() {
            try {
                const response = await fetch('https://restcountries.com/v3.1/all?fields=name');
                const countries = await response.json();
                countries.sort((a, b) => a.name.common.localeCompare(b.name.common));
                const select = document.getElementById('countrySelect');
                countries.forEach(country => {
                    const option = document.createElement('option');
                    option.value = country.name.common;
                    option.textContent = country.name.common;
                    select.appendChild(option);
                });
            } catch (e) {
                console.error("Erreur chargement des pays", e);
            }
        }
        loadCountries();

        // Gestion du basculement visuel Inscription / Connexion
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const formTitle = document.getElementById('form-title');
        const toggleBtn = document.getElementById('toggleBtn');
        const toggleTextMsg = document.getElementById('toggleTextMsg');

        let isLoginMode = true;

        toggleBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                formTitle.textContent = "Connexion Love Bébé";
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                toggleTextMsg.textContent = "Pas encore de compte ?";
                toggleBtn.textContent = "S'inscrire";
            } else {
                formTitle.textContent = "Inscription Love Bébé";
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                toggleTextMsg.textContent = "Déjà inscrit ?";
                toggleBtn.textContent = "Se connecter";
            }
        });

        // Traitement de la Connexion
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = "";

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                // Vérification du rôle Administrateur et redirection automatique
                await checkAdminAndRedirect(userCredential.user);
            } catch (error) {
                errorDiv.textContent = "Erreur : Email ou mot de passe incorrect.";
            }
        });

        // Traitement de l'Inscription
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('regError');
            errorDiv.textContent = "";

            const fullName = document.getElementById('fullName').value.trim();
            const city = document.getElementById('city').value.trim();
            const country = document.getElementById('countrySelect').value;
            const department = document.getElementById('department').value.trim();
            const age = parseInt(document.getElementById('age').value);
            const targetAge = document.getElementById('targetAge').value;
            const soulMateType = document.getElementById('soulMateType').value;
            const nationalitySearch = document.getElementById('nationalitySearch').value.trim();
            const countryCode = document.getElementById('countryCode').value;
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const mediaFile = document.getElementById('profileImage').files[0];

            if (!fullName || !city || !country || !department || !age || !targetAge || !soulMateType || !nationalitySearch || !phoneNumber || !email || !password || !mediaFile) {
                errorDiv.textContent = "Tous les champs sont obligatoires !";
                return;
            }

            if (age < 16) {
                errorDiv.textContent = "Vous devez avoir au moins 16 ans.";
                return;
            }

            try {
                // 1. Upload automatique du média (Image/Vidéo) vers Cloudinary
                const mediaUrl = await uploadMediaToCloudinary(mediaFile);

                // 2. Création du compte Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 3. Enregistrement des détails du profil sous la Realtime Database
                const userRef = ref(rtdb, `users/${user.uid}`);
                await update(userRef, {
                    fullName,
                    city,
                    country,
                    department,
                    age,
                    targetAge,
                    soulMateType,
                    nationalitySearch,
                    fullPhoneNumber: `${countryCode} ${phoneNumber}`,
                    email,
                    profileMediaUrl: mediaUrl,
                    createdAt: new Date().toISOString()
                });

                // 4. Attribution automatique du rôle et redirection
                await checkAdminAndRedirect(user);

            } catch (error) {
                errorDiv.textContent = "Erreur lors de l'inscription : " + error.message;
            }
        });
    </script>
</body>
</html>
