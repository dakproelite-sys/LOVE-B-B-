<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Bébé - Connexion & Inscription</title>
    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-gold: #FFA500;
            --deep-red: #D32F2F;
            --dark-red: #B71C1C;
            --accent-blue: #0D47A1;
        }
        body {
            background: linear-gradient(135deg, var(--primary-gold) 0%, var(--dark-gold) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #FFFFFF;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            border: 4px solid var(--primary-gold);
            box-sizing: border-box;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-wrapper {
            width: 90px;
            height: 90px;
            margin: 0 auto;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--primary-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h2 {
            text-align: center;
            color: var(--deep-red);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: var(--accent-blue);
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--deep-red);
        }
        .password-container {
            position: relative;
        }
        .password-container input {
            padding-right: 40px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 55%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
        }
        button[type="submit"] {
            background: linear-gradient(to right, var(--deep-red), var(--dark-red));
            color: #FFFFFF;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4);
        }
        button[type="submit"]:hover {
            opacity: 0.9;
        }
        button:disabled {
            background: #cccccc !important;
            cursor: not-allowed;
        }
        .switch-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #333;
        }
        .switch-link span {
            color: var(--accent-blue);
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
        }
        .error-msg {
            color: var(--deep-red);
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-container">
            <div class="logo-wrapper">
                <img src="https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png" alt="Logo Love Bébé" crossorigin="anonymous">
            </div>
        </div>

        <h2 id="form-title">Connexion Love Bébé</h2>

        <!-- FORMULAIRE DE CONNEXION -->
        <form id="loginForm">
            <label>Email :</label>
            <input type="email" id="loginEmail" required placeholder="exemple@domaine.com">

            <label>Mot de passe :</label>
            <div class="password-container">
                <input type="password" id="loginPassword" required placeholder="••••••••">
                <span class="toggle-password" onclick="togglePasswordVisibility('loginPassword', this)">👁️</span>
            </div>

            <button type="submit" id="btnLogin">Se connecter</button>
            <div id="loginError" class="error-msg"></div>
        </form>

        <!-- FORMULAIRE D'INSCRIPTION -->
        <form id="registerForm" class="hidden">
            <label>Nom complet :</label>
            <input type="text" id="fullName" required placeholder="Ex: Kouassi Jean">

            <label>Genre / Sexe :</label>
            <select id="gender" required>
                <option value="">Sélectionnez votre sexe</option>
                <option value="Masculin">Masculin (Homme)</option>
                <option value="Féminin">Féminin (Femme)</option>
            </select>

            <label>Ville :</label>
            <input type="text" id="city" required placeholder="Ex: Cotonou / Abidjan">

            <label>Pays :</label>
            <input type="text" id="countryInput" required placeholder="Ex: Bénin / Côte d'Ivoire">

            <label>Statut Matrimonial :</label>
            <select id="maritalStatus" required>
                <option value="Célibataire sans enfant">Célibataire sans enfant</option>
                <option value="Célibataire avec enfant(s)">Célibataire avec enfant(s)</option>
                <option value="Marié(e)">Marié(e)</option>
            </select>

            <label>Âge (minimum 18 ans requis) :</label>
            <input type="number" id="age" min="18" required placeholder="Votre âge">

            <label>Email :</label>
            <input type="email" id="regEmail" required placeholder="exemple@domaine.com">

            <label>Mot de passe :</label>
            <div class="password-container">
                <input type="password" id="regPassword" required placeholder="••••••••">
                <span class="toggle-password" onclick="togglePasswordVisibility('regPassword', this)">👁️</span>
            </div>

            <label>Photo ou Vidéo de profil :</label>
            <input type="file" id="profileImage" accept="image/*,video/*">

            <button type="submit" id="btnRegister">S'inscrire</button>
            <div id="regError" class="error-msg"></div>
        </form>

        <div class="switch-link">
            <span id="toggleTextMsg">Pas encore de compte ?</span> <span id="toggleBtn">S'inscrire</span>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(fieldId, iconElement) {
            const field = document.getElementById(fieldId);
            if (field.type === "password") {
                field.type = "text";
                iconElement.textContent = "🙈";
            } else {
                field.type = "password";
                iconElement.textContent = "👁️";
            }
        }

        // Compression locale de l'image via Canvas
        function compressImage(file, maxWidth = 600, maxHeight = 600, quality = 0.6) {
            return new Promise((resolve, reject) => {
                if (file.type.startsWith('video/')) {
                    resolve(file); // Les vidéos ne sont pas traitées via le canvas
                    return;
                }

                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height *= maxWidth / width;
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width *= maxHeight / height;
                                height = maxHeight;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            if (blob) {
                                const compressedFile = new File([blob], file.name, {
                                    type: 'image/jpeg',
                                    lastModified: Date.now()
                                });
                                resolve(compressedFile);
                            } else {
                                resolve(file);
                            }
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = (err) => reject(err);
                };
            });
        }
    </script>

    <script type="module">
        import { auth, checkAdminAndRedirect, rtdb } from "./love-bebe-service.js";
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const formTitle = document.getElementById('form-title');
        const toggleBtn = document.getElementById('toggleBtn');
        const toggleTextMsg = document.getElementById('toggleTextMsg');
        const loginError = document.getElementById('loginError');
        const regError = document.getElementById('regError');

        let isLoginMode = true;

        // Bascule Connexion <-> Inscription
        toggleBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            loginError.textContent = "";
            regError.textContent = "";

            if (isLoginMode) {
                formTitle.textContent = "Connexion Love Bébé";
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                toggleTextMsg.textContent = "Pas encore de compte ?";
                toggleBtn.textContent = "S'inscrire";
            } else {
                formTitle.textContent = "Inscription Love Bébé";
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                toggleTextMsg.textContent = "Déjà inscrit ?";
                toggleBtn.textContent = "Se connecter";
            }
        });

        // Envoi vers Cloudinary en utilisant la configuration stockée dans Firebase Realtime Database
        async function uploadFileToCloudinary(file) {
            const snapshot = await get(child(ref(rtdb), 'config/cloudinary'));
            
            if (!snapshot.exists()) {
                throw new Error("La configuration Cloudinary est introuvable dans Realtime Database.");
            }

            const cloudConfig = snapshot.val();
            const uploadUrl = cloudConfig.upload_url || `https://api.cloudinary.com/v1_1/${cloudConfig.cloud_name}/auto/upload`;
            const uploadPreset = cloudConfig.upload_preset;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', uploadPreset);

            const response = await fetch(uploadUrl, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error?.message || "Échec du téléversement vers Cloudinary.");
            }

            return data.secure_url;
        }

        // Soumission du Formulaire de Connexion
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.textContent = "";
            const btnLogin = document.getElementById('btnLogin');

            try {
                btnLogin.disabled = true;
                btnLogin.textContent = "Connexion en cours...";

                const cred = await signInWithEmailAndPassword(
                    auth,
                    document.getElementById('loginEmail').value.trim(),
                    document.getElementById('loginPassword').value.trim()
                );
                await checkAdminAndRedirect(cred.user);
            } catch (err) {
                loginError.textContent = "Erreur de connexion : " + err.message;
            } finally {
                btnLogin.disabled = false;
                btnLogin.textContent = "Se connecter";
            }
        });

        // Soumission du Formulaire d'Inscription
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            regError.textContent = "";
            const btnRegister = document.getElementById('btnRegister');

            try {
                const ageInput = parseInt(document.getElementById('age').value);

                // Vérification stricte de l'âge
                if (isNaN(ageInput) || ageInput < 18) {
                    regError.textContent = "Inscription refusée : Vous devez avoir au moins 18 ans.";
                    return;
                }

                btnRegister.disabled = true;
                btnRegister.textContent = "Traitement en cours...";

                const mediaFileInput = document.getElementById('profileImage').files[0];
                let profileMediaUrl = "";

                if (mediaFileInput) {
                    btnRegister.textContent = "Compression de l'image...";
                    const compressedFile = await compressImage(mediaFileInput);

                    btnRegister.textContent = "Téléversement sur Cloudinary...";
                    profileMediaUrl = await uploadFileToCloudinary(compressedFile);
                }

                btnRegister.textContent = "Création du compte...";
                const email = document.getElementById('regEmail').value.trim();
                const password = document.getElementById('regPassword').value.trim();

                const cred = await createUserWithEmailAndPassword(auth, email, password);
                const user = cred.user;

                // Enregistrement dans Realtime Database sous users/{uid}
                await set(ref(rtdb, `users/${user.uid}`), {
                    fullName: document.getElementById('fullName').value.trim(),
                    gender: document.getElementById('gender').value,
                    city: document.getElementById('city').value.trim(),
                    country: document.getElementById('countryInput').value.trim(),
                    maritalStatus: document.getElementById('maritalStatus').value,
                    age: ageInput,
                    email: user.email,
                    profileMediaUrl: profileMediaUrl,
                    createdAt: new Date().toISOString()
                });

                await checkAdminAndRedirect(user);
            } catch (err) {
                regError.textContent = "Erreur d'inscription : " + err.message;
            } finally {
                btnRegister.disabled = false;
                btnRegister.textContent = "S'inscrire";
            }
        });
    </script>
</body>
</html>
