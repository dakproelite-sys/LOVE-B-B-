
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Bébé - Connexion & Inscription Internationale</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFD700">

    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-gold: #FFA500;
            --deep-red: #D32F2F;
            --dark-red: #B71C1C;
            --accent-blue: #0D47A1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(
                135deg,
                var(--primary-gold) 0%,
                var(--dark-gold) 100%
            );
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: #FFFFFF;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 520px;
            border: 4px solid var(--primary-gold);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo-wrapper {
            width: 90px;
            height: 90px;
            margin: 0 auto;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--primary-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h2 {
            text-align: center;
            color: var(--deep-red);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: var(--accent-blue);
            font-size: 13px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--deep-red);
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 40px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 55%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
            user-select: none;
        }

        .phone-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .phone-group select {
            flex: 1.6;
            min-width: 0;
        }

        .phone-group input {
            flex: 1.4;
            min-width: 0;
        }

        .checkbox-container {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 15px;
            font-size: 12px;
            color: #333;
        }

        .checkbox-container input {
            width: auto;
            margin: 3px 0 0;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkbox-container label {
            margin: 0;
            font-weight: normal;
            line-height: 1.5;
        }

        .checkbox-container a {
            color: var(--accent-blue);
            font-weight: bold;
            text-decoration: underline;
        }

        button[type="submit"] {
            background: linear-gradient(
                to right,
                var(--deep-red),
                var(--dark-red)
            );
            color: #FFFFFF;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4);
        }

        button[type="submit"]:hover {
            opacity: 0.9;
        }

        button[type="submit"]:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .switch-link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #333;
            line-height: 1.8;
        }

        .switch-link span {
            color: var(--accent-blue);
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
        }

        .switch-link span:focus-visible {
            outline: 2px solid var(--accent-blue);
            outline-offset: 3px;
        }

        .error-msg {
            color: var(--deep-red);
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .hidden {
            display: none !important;
        }

        #pageStatus {
            text-align: center;
            color: var(--accent-blue);
            font-size: 14px;
            font-weight: bold;
            margin: 12px 0;
        }

        @media (max-width: 420px) {
            body {
                padding: 10px;
            }

            .card {
                padding: 20px 15px;
            }

            h2 {
                font-size: 1.2rem;
            }

            .phone-group {
                gap: 6px;
            }
        }
    </style>
</head>

<script>
    function togglePasswordVisibility(fieldId, iconElement) {
        const field = document.getElementById(fieldId);

        if (field.type === "password") {
            field.type = "text";
            iconElement.textContent = "🙈";
        } else {
            field.type = "password";
            iconElement.textContent = "👁️";
        }
    }
</script>

<script type="module">
    import {
        auth,
        uploadMediaToCloudinary,
        rtdb
    } from "./love-bebe-service.js";

    import {
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
        ref,
        get,
        update
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const formTitle = document.getElementById("form-title");
    const toggleBtn = document.getElementById("toggleBtn");
    const toggleTextMsg = document.getElementById("toggleTextMsg");
    const switchArea = document.getElementById("switchArea");
    const pageStatus = document.getElementById("pageStatus");

    const loginError = document.getElementById("loginError");
    const regError = document.getElementById("regError");
    const loginSubmitBtn = document.getElementById("loginSubmitBtn");
    const registerSubmitBtn = document.getElementById("registerSubmitBtn");

    let isLoginMode = true;
    let isRegistering = false;
    let redirectInProgress = false;
    let authInitialized = false;

    // --------------------------------------------------
    // 1. BASCULE ENTRE CONNEXION ET INSCRIPTION
    // --------------------------------------------------

    function showForm(loginMode) {
        isLoginMode = loginMode;

        loginForm.classList.toggle("hidden", !loginMode);
        registerForm.classList.toggle("hidden", loginMode);

        formTitle.textContent = loginMode
            ? "Connexion Love Bébé"
            : "Inscription Love Bébé";

        toggleTextMsg.textContent = loginMode
            ? "Pas encore de compte ?"
            : "Déjà inscrit ?";

        toggleBtn.textContent = loginMode
            ? "S'inscrire"
            : "Se connecter";

        toggleBtn.setAttribute(
            "aria-controls",
            loginMode ? "registerForm" : "loginForm"
        );

        loginError.textContent = "";
        regError.textContent = "";

        loginError.style.color = "#D32F2F";
        regError.style.color = "#D32F2F";

        pageStatus.classList.add("hidden");
        switchArea.classList.remove("hidden");
    }

    function toggleForms() {
        if (redirectInProgress || isRegistering) return;
        showForm(!isLoginMode);
    }

    toggleBtn.addEventListener("click", toggleForms);

    toggleBtn.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleForms();
        }
    });

    // --------------------------------------------------
    // 2. VÉRIFICATION DU COMPTE ADMINISTRATEUR
    // --------------------------------------------------

    async function isAdministrator(user) {
        const email = (user.email || "").toLowerCase();

        const [adminSnapshot, userSnapshot] = await Promise.all([
            get(ref(rtdb, "config/admin")),
            get(ref(rtdb, `users/${user.uid}`))
        ]);

        const adminConfig = adminSnapshot.exists()
            ? adminSnapshot.val()
            : {};

        const profile = userSnapshot.exists()
            ? userSnapshot.val()
            : {};

        const configuredEmail =
            typeof adminConfig.email === "string"
                ? adminConfig.email.toLowerCase()
                : "";

        // L'adresse configurée pour l'administration.
        if (
            email &&
            configuredEmail &&
            email === configuredEmail
        ) {
            return true;
        }

        // Compatibilité avec les profils administrateurs existants.
        return profile.role === "admin" ||
               profile.isAdmin === true;
    }

    // --------------------------------------------------
    // 3. REDIRECTION APRÈS CONNEXION OU SESSION EXISTANTE
    // --------------------------------------------------

    async function redirectAuthenticatedUser(user) {
        if (
            !user ||
            redirectInProgress ||
            isRegistering
        ) {
            return;
        }

        redirectInProgress = true;

        loginForm.classList.add("hidden");
        registerForm.classList.add("hidden");
        switchArea.classList.add("hidden");

        formTitle.textContent = "Bienvenue sur Love Bébé";
        pageStatus.textContent = "Vérification de votre compte...";
        pageStatus.classList.remove("hidden");

        try {
            const admin = await isAdministrator(user);

            if (admin) {
                window.location.replace("admin.html");
            } else {
                window.location.replace("index.html");
            }
        } catch (error) {
            console.error("Erreur de vérification du compte :", error);

            redirectInProgress = false;

            pageStatus.classList.add("hidden");
            switchArea.classList.remove("hidden");

            if (isLoginMode) {
                loginError.textContent =
                    "Impossible de vérifier votre compte. Vérifiez votre connexion et les règles de la base de données.";
            } else {
                regError.textContent =
                    "Impossible de vérifier votre compte. Vérifiez votre connexion et les règles de la base de données.";
            }

            showForm(isLoginMode);
        }
    }

    // --------------------------------------------------
    // 4. SESSION FIREBASE AUTOMATIQUE
    // --------------------------------------------------

    onAuthStateChanged(auth, async (user) => {
        authInitialized = true;

        // Pendant la création du profil, attendre la fin
        // de l'enregistrement avant de rediriger.
        if (isRegistering || redirectInProgress) return;

        if (user) {
            await redirectAuthenticatedUser(user);
        } else {
            showForm(true);
        }
    });

    // --------------------------------------------------
    // 5. CONNEXION
    // --------------------------------------------------

    loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (redirectInProgress || isRegistering) return;

        loginError.textContent = "";
        loginSubmitBtn.disabled = true;
        loginSubmitBtn.textContent = "Connexion en cours...";

        try {
            const email = document
                .getElementById("loginEmail")
                .value.trim();

            // Ne pas supprimer les espaces du mot de passe :
            // ils peuvent faire partie du mot de passe réel.
            const password = document
                .getElementById("loginPassword")
                .value;

            const credential = await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            // Appeler directement la redirection pour ne pas
            // dépendre du délai de déclenchement de l'observateur.
            await redirectAuthenticatedUser(credential.user);

        } catch (error) {
            console.error("Erreur de connexion :", error);

            const messages = {
                "auth/invalid-credential":
                    "Adresse e-mail ou mot de passe incorrect.",
                "auth/user-not-found":
                    "Aucun compte trouvé avec cette adresse.",
                "auth/wrong-password":
                    "Mot de passe incorrect.",
                "auth/invalid-email":
                    "Veuillez saisir une adresse e-mail valide.",
                "auth/too-many-requests":
                    "Trop de tentatives. Réessayez plus tard.",
                "auth/network-request-failed":
                    "Problème de connexion Internet.",
                "auth/user-disabled":
                    "Ce compte a été désactivé."
            };

            loginError.textContent =
                messages[error.code] ||
                "Connexion impossible. Vérifiez vos identifiants et réessayez.";

        } finally {
            loginSubmitBtn.disabled = false;
            loginSubmitBtn.textContent = "Se connecter";
        }
    });

    // --------------------------------------------------
    // 6. INSCRIPTION
    // --------------------------------------------------

    registerForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (redirectInProgress || isRegistering) return;

        regError.textContent = "";
        regError.style.color = "#D32F2F";

        const ageValue = Number(
            document.getElementById("age").value
        );

        if (!Number.isInteger(ageValue) || ageValue < 18) {
            regError.textContent =
                "Inscription réservée aux personnes âgées de 18 ans et plus.";
            return;
        }

        if (!document.getElementById("termsCheckbox").checked) {
            regError.textContent =
                "Veuillez accepter les conditions d'utilisation.";
            return;
        }

        const password = document
            .getElementById("regPassword")
            .value;

        if (password.length < 6) {
            regError.textContent =
                "Le mot de passe doit contenir au moins 6 caractères.";
            return;
        }

        const mediaFile = document
            .getElementById("profileImage")
            .files[0];

        if (mediaFile && !mediaFile.type.startsWith("image/")) {
            regError.textContent =
                "Veuillez choisir une photo de profil au format image.";
            return;
        }

        isRegistering = true;
        registerSubmitBtn.disabled = true;
        registerSubmitBtn.textContent = "Inscription en cours...";

        let accountCreated = false;

        try {
            let mediaUrl =
                "https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png";

            // Téléverser la photo avant de créer le compte.
            if (mediaFile) {
                regError.style.color = "#0D47A1";
                regError.textContent =
                    "Téléversement de votre photo en cours...";

                mediaUrl = await uploadMediaToCloudinary(mediaFile);

                if (!mediaUrl || typeof mediaUrl !== "string") {
                    throw new Error(
                        "Le téléversement n'a pas retourné de lien valide."
                    );
                }
            }

            regError.style.color = "#0D47A1";
            regError.textContent =
                "Création de votre compte dans Firebase...";

            const email = document
                .getElementById("regEmail")
                .value.trim();

            const credential = await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

            const user = credential.user;
            accountCreated = true;

            const fullPhoneNumber =
                document.getElementById("phoneCode").value +
                document.getElementById("whatsappNumber").value.trim();

            regError.textContent =
                "Enregistrement de votre profil...";

            // Enregistrer le profil dans Realtime Database.
            // Le mot de passe n'est jamais enregistré ici.
            await update(ref(rtdb, `users/${user.uid}`), {
                fullName: document.getElementById("fullName").value.trim(),
                gender: document.getElementById("gender").value,
                city: document.getElementById("city").value.trim(),
                country: document.getElementById("countryInput").value.trim(),
                whatsappNumber: fullPhoneNumber,
                maritalStatus: document.getElementById("maritalStatus").value,
                age: ageValue,
                email: user.email,
                profileMediaUrl: mediaUrl,
                acceptedTerms: true,
                role: "user",
                isAdmin: false,
                createdAt: new Date().toISOString()
            });

            regError.style.color = "#0D47A1";
            regError.textContent =
                "Inscription réussie ! Ouverture de votre espace...";

            // Le compte et le profil existent.
            // L'utilisateur nouvellement inscrit est un utilisateur normal.
            isRegistering = false;
            await redirectAuthenticatedUser(user);

        } catch (error) {
            console.error("Erreur d'inscription :", error);

            if (accountCreated) {
                // Le compte Authentication existe déjà.
                // Ne pas demander de recréer un deuxième compte.
                regError.textContent =
                    "Votre compte a été créé, mais l'enregistrement du profil a échoué. Votre compte existe déjà. Vérifiez les règles Realtime Database avant de réessayer.";

                // On garde la session active, sans boucle de redirection.
                // L'utilisateur pourra reprendre après correction.
            } else {
                const messages = {
                    "auth/email-already-in-use":
                        "Cette adresse e-mail possède déjà un compte. Cliquez sur Se connecter.",
                    "auth/invalid-email":
                        "Veuillez saisir une adresse e-mail valide.",
                    "auth/weak-password":
                        "Votre mot de passe doit contenir au moins 6 caractères.",
                    "auth/network-request-failed":
                        "Problème Internet. Vérifiez votre connexion.",
                    "auth/operation-not-allowed":
                        "L'inscription par e-mail n'est pas activée dans Firebase Authentication."
                };

                regError.textContent =
                    messages[error.code] ||
                    error.message ||
                    "Inscription impossible. Vérifiez la configuration Firebase.";
            }

        } finally {
            isRegistering = false;
            registerSubmitBtn.disabled = false;
            registerSubmitBtn.textContent = "S'inscrire";
        }
    });

    // --------------------------------------------------
    // 7. ÉTAT INITIAL
    // --------------------------------------------------

    // Attendre que Firebase ait vérifié la session.
    // Si aucune session n'existe, la connexion est affichée.
    showForm(true);
</script>

</body>
</html>
