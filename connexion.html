<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Bébé - Connexion & Inscription Internationale</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFD700">

    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-gold: #FFA500;
            --deep-red: #D32F2F;
            --dark-red: #B71C1C;
            --accent-blue: #0D47A1;
        }

        body {
            background: linear-gradient(135deg, var(--primary-gold), var(--dark-gold));
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,.3);
            width: 100%;
            max-width: 520px;
            border: 4px solid var(--primary-gold);
            box-sizing: border-box;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo-wrapper {
            width: 90px;
            height: 90px;
            margin: 0 auto;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--primary-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,.2);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h2 {
            text-align: center;
            color: var(--deep-red);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: var(--accent-blue);
            font-size: 13px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--deep-red);
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 40px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 55%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
        }

        .phone-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .phone-group select,
        .phone-group input {
            flex: 1;
            min-width: 0;
        }

        .checkbox-container {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 15px;
            font-size: 12px;
            color: #333;
        }

        .checkbox-container input {
            width: auto;
            margin-top: 3px;
            flex-shrink: 0;
        }

        .checkbox-container label {
            margin: 0;
            font-weight: normal;
            color: #333;
        }

        .checkbox-container a {
            color: var(--accent-blue);
            font-weight: bold;
            text-decoration: underline;
        }

        button[type="submit"] {
            background: linear-gradient(to right, var(--deep-red), var(--dark-red));
            color: #fff;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(211,47,47,.4);
        }

        button[type="submit"]:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .switch-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #333;
        }

        .switch-link span {
            color: var(--accent-blue);
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
        }

        .error-msg {
            color: var(--deep-red);
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .hidden {
            display: none !important;
        }

        .photo-preview {
            display: block;
            width: 90px;
            height: 90px;
            margin: 12px auto 0;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--primary-gold);
        }

        .help-text {
            font-size: 12px;
            color: #555;
            margin-top: 5px;
            line-height: 1.4;
        }

        @media (max-width: 400px) {
            .card {
                padding: 20px 15px;
            }

            .phone-group {
                gap: 6px;
            }
        }
    </style>
</head>

<body>
<div class="card">

    <div class="logo-container">
        <div class="logo-wrapper">
            <img
                src="https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png"
                alt="Logo Love Bébé"
            >
        </div>
    </div>

    <h2 id="form-title">Connexion Love Bébé</h2>

    <!-- CONNEXION -->
    <form id="loginForm">
        <label for="loginEmail">Email :</label>
        <input
            type="email"
            id="loginEmail"
            autocomplete="email"
            required
            placeholder="exemple@domaine.com"
        >

        <label for="loginPassword">Mot de passe :</label>
        <div class="password-container">
            <input
                type="password"
                id="loginPassword"
                autocomplete="current-password"
                required
                placeholder="Votre mot de passe"
            >
            <span
                class="toggle-password"
                onclick="togglePasswordVisibility('loginPassword', this)"
                role="button"
                aria-label="Afficher ou masquer le mot de passe"
            >👁️</span>
        </div>

        <button type="submit" id="loginButton">Se connecter</button>
        <div id="loginError" class="error-msg" role="status"></div>
    </form>

    <!-- INSCRIPTION -->
    <form id="registerForm" class="hidden">

        <label for="fullName">Nom complet :</label>
        <input
            type="text"
            id="fullName"
            autocomplete="name"
            required
            placeholder="Ex : Kouassi Jean"
        >

        <label for="gender">Genre / Sexe :</label>
        <select id="gender" required>
            <option value="">Sélectionnez votre sexe</option>
            <option value="Masculin">Masculin (Homme)</option>
            <option value="Féminin">Féminin (Femme)</option>
        </select>

        <label for="city">Ville :</label>
        <input
            type="text"
            id="city"
            required
            placeholder="Ex : Cotonou, Abidjan, Paris"
        >

        <label for="countryInput">Pays de résidence :</label>
        <input
            type="text"
            id="countryInput"
            required
            placeholder="Ex : Bénin, France, Canada"
        >

        <label for="phoneCode">Numéro WhatsApp :</label>
        <div class="phone-group">
            <select id="phoneCode" required>
                <option value="+229">🇧🇯 Bénin (+229)</option>
            </select>

            <input
                type="tel"
                id="whatsappNumber"
                required
                autocomplete="tel-national"
                placeholder="Numéro de téléphone"
            >
        </div>

        <label for="maritalStatus">Statut matrimonial :</label>
        <select id="maritalStatus" required>
            <option value="">Sélectionnez votre situation</option>
            <option value="Je ne suis jamais marié(e)">
                Je ne suis jamais marié(e)
            </option>
            <option value="Je n'ai jamais été marié(e) et je suis célibataire">
                Jamais marié(e), actuellement célibataire
            </option>
            <option value="J'ai été marié(e) une fois et aujourd'hui je suis célibataire">
                Déjà marié(e), aujourd'hui célibataire
            </option>
            <option value="Célibataire sans enfant">Célibataire sans enfant</option>
            <option value="Célibataire avec un enfant">Célibataire avec un enfant</option>
            <option value="Célibataire avec des enfants">
                Célibataire avec des enfants
            </option>
            <option value="Divorcé(e)">Divorcé(e)</option>
            <option value="Veuf / Veuve">Veuf / Veuve</option>
        </select>

        <label for="age">Âge (18 ans minimum) :</label>
        <input
            type="number"
            id="age"
            min="18"
            max="120"
            step="1"
            required
            placeholder="Ex : 24"
        >

        <label for="regEmail">Email :</label>
        <input
            type="email"
            id="regEmail"
            autocomplete="email"
            required
            placeholder="exemple@domaine.com"
        >

        <label for="regPassword">Mot de passe (6 caractères minimum) :</label>
        <div class="password-container">
            <input
                type="password"
                id="regPassword"
                autocomplete="new-password"
                minlength="6"
                required
                placeholder="Créer un mot de passe"
            >
            <span
                class="toggle-password"
                onclick="togglePasswordVisibility('regPassword', this)"
                role="button"
                aria-label="Afficher ou masquer le mot de passe"
            >👁️</span>
        </div>

        <label for="profileImage">Photo de profil (facultative) :</label>
        <input
            type="file"
            id="profileImage"
            accept="image/jpeg,image/png,image/webp,image/gif"
        >

        <p class="help-text">
            Choisissez une photo dans la galerie de votre téléphone.
            Elle sera redimensionnée et enregistrée dans le profil Firebase.
            Aucune photo n'est envoyée à Cloudinary.
        </p>

        <img id="photoPreview" class="photo-preview hidden" alt="Aperçu de la photo">

        <div class="checkbox-container">
            <input type="checkbox" id="termsCheckbox" required>
            <label for="termsCheckbox">
                J'accepte les
                <a href="politique-de-confidentialite.html" target="_blank" rel="noopener">
                    Conditions d'utilisation et la Politique de confidentialité
                </a>.
            </label>
        </div>

        <button type="submit" id="registerButton">Créer mon compte</button>
        <div id="regError" class="error-msg" role="status"></div>
    </form>

    <div class="switch-link">
        <span id="toggleTextMsg">Pas encore de compte ?</span>
        <span id="toggleBtn">S'inscrire</span>
    </div>
</div>

<script>
    function togglePasswordVisibility(fieldId, iconElement) {
        const field = document.getElementById(fieldId);

        if (field.type === "password") {
            field.type = "text";
            iconElement.textContent = "🙈";
        } else {
            field.type = "password";
            iconElement.textContent = "👁️";
        }
    }
</script>

<script type="module">
    import { auth, rtdb } from "./love-bebe-service.js";

    import {
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
        ref,
        get,
        set
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const formTitle = document.getElementById("form-title");
    const toggleBtn = document.getElementById("toggleBtn");
    const toggleTextMsg = document.getElementById("toggleTextMsg");

    const loginButton = document.getElementById("loginButton");
    const registerButton = document.getElementById("registerButton");

    const loginError = document.getElementById("loginError");
    const regError = document.getElementById("regError");

    let isLoginMode = true;
    let isSubmitting = false;

    // =====================================================
    // CHARGEMENT DES INDICATIFS INTERNATIONAUX
    // =====================================================

    async function loadWorldPhoneCodes() {
        const phoneSelect = document.getElementById("phoneCode");

        // Toujours avoir une option utilisable, même hors connexion.
        phoneSelect.innerHTML = "";

        const beninOption = document.createElement("option");
        beninOption.value = "+229";
        beninOption.textContent = "🇧🇯 Bénin (+229)";
        phoneSelect.appendChild(beninOption);

        try {
            const response = await fetch(
                "https://restcountries.com/v3.1/all?fields=name,idd,flag,translations"
            );

            if (!response.ok) {
                throw new Error("Impossible de charger les indicatifs.");
            }

            const countries = await response.json();
            const codes = new Map();

            countries.forEach(country => {
                if (!country.idd || !country.idd.root) return;

                const root = country.idd.root;
                const suffixes =
                    country.idd.suffixes && country.idd.suffixes.length
                        ? country.idd.suffixes
                        : [""];

                const countryName =
                    country.translations?.fra?.common ||
                    country.name?.common ||
                    "Pays";

                const flag = country.flag || "🌐";

                suffixes.forEach(suffix => {
                    const code = `${root}${suffix}`.trim();

                    if (!code || code === "+" || code === "+229") return;

                    const key = `${countryName}|${code}`;

                    codes.set(key, {
                        code,
                        name: countryName,
                        flag
                    });
                });
            });

            [...codes.values()]
                .sort((a, b) => a.name.localeCompare(b.name, "fr"))
                .forEach(item => {
                    const option = document.createElement("option");
                    option.value = item.code;
                    option.textContent =
                        `${item.flag} ${item.name} (${item.code})`;

                    phoneSelect.appendChild(option);
                });

        } catch (error) {
            console.warn("Indicatifs internationaux :", error);
            // L'indicatif du Bénin reste disponible.
        }
    }

    loadWorldPhoneCodes();

    // =====================================================
    // BASCULE ENTRE CONNEXION ET INSCRIPTION
    // =====================================================

    toggleBtn.addEventListener("click", () => {
        if (isSubmitting) return;

        isLoginMode = !isLoginMode;

        loginError.textContent = "";
        regError.textContent = "";

        if (isLoginMode) {
            formTitle.textContent = "Connexion Love Bébé";
            loginForm.classList.remove("hidden");
            registerForm.classList.add("hidden");
            toggleTextMsg.textContent = "Pas encore de compte ?";
            toggleBtn.textContent = "S'inscrire";
        } else {
            formTitle.textContent = "Inscription Love Bébé";
            loginForm.classList.add("hidden");
            registerForm.classList.remove("hidden");
            toggleTextMsg.textContent = "Déjà inscrit ?";
            toggleBtn.textContent = "Se connecter";
        }
    });

    // =====================================================
    // APERÇU DE LA PHOTO CHOISIE
    // =====================================================

    const profileImageInput = document.getElementById("profileImage");
    const photoPreview = document.getElementById("photoPreview");

    profileImageInput.addEventListener("change", () => {
        photoPreview.classList.add("hidden");
        photoPreview.removeAttribute("src");

        const file = profileImageInput.files?.[0];
        if (!file) return;

        if (!file.type.startsWith("image/")) {
            regError.textContent = "Veuillez choisir un fichier image.";
            profileImageInput.value = "";
            return;
        }

        if (file.size > 8 * 1024 * 1024) {
            regError.textContent =
                "La photo dépasse 8 Mo. Choisissez une image plus légère.";
            profileImageInput.value = "";
            return;
        }

        regError.textContent = "";

        const previewUrl = URL.createObjectURL(file);
        photoPreview.src = previewUrl;
        photoPreview.classList.remove("hidden");

        photoPreview.onload = () => URL.revokeObjectURL(previewUrl);
    });

    // =====================================================
    // COMPRESSION LOCALE DE LA PHOTO
    // Aucun envoi vers un service d'hébergement.
    // =====================================================

    async function compressImageToDataURL(file) {
        if (!file) return "";

        if (!file.type.startsWith("image/")) {
            throw new Error("Le fichier sélectionné n'est pas une image.");
        }

        if (file.size > 8 * 1024 * 1024) {
            throw new Error("La photo doit peser moins de 8 Mo.");
        }

        const image = new Image();
        const objectUrl = URL.createObjectURL(file);

        try {
            await new Promise((resolve, reject) => {
                image.onload = resolve;
                image.onerror = () => reject(
                    new Error("Impossible de lire cette image.")
                );
                image.src = objectUrl;
            });

            const maxDimension = 350;
            const scale = Math.min(
                1,
                maxDimension / Math.max(image.naturalWidth, image.naturalHeight)
            );

            const width = Math.max(1, Math.round(image.naturalWidth * scale));
            const height = Math.max(1, Math.round(image.naturalHeight * scale));

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;

            const context = canvas.getContext("2d");

            if (!context) {
                throw new Error("Impossible de préparer la photo.");
            }

            context.fillStyle = "#FFFFFF";
            context.fillRect(0, 0, width, height);
            context.drawImage(image, 0, 0, width, height);

            // JPEG compressé pour réduire la taille enregistrée dans Firebase.
            const dataUrl = canvas.toDataURL("image/jpeg", 0.65);

            // Vérification indicative pour éviter une très grosse valeur.
            const approximateBytes = Math.ceil(dataUrl.length * 3 / 4);

            if (approximateBytes > 300 * 1024) {
                throw new Error(
                    "La photo reste trop volumineuse après compression. " +
                    "Choisissez une autre photo."
                );
            }

            return dataUrl;

        } finally {
            URL.revokeObjectURL(objectUrl);
        }
    }

    // =====================================================
    // REDIRECTION APRÈS CONNEXION OU INSCRIPTION
    // =====================================================

    async function handlePostAuthRedirection(user) {
        const userRef = ref(rtdb, `users/${user.uid}`);
        const adminRef = ref(rtdb, "config/admin");

        const [userSnap, adminSnap] = await Promise.all([
            get(userRef),
            get(adminRef)
        ]);

        const userData = userSnap.exists() ? userSnap.val() : {};
        const adminData = adminSnap.exists() ? adminSnap.val() : {};

        const accountEmail = String(user.email || "").toLowerCase();
        const configuredAdminEmail =
            String(adminData.email || "").toLowerCase();

        const isAdmin =
            (configuredAdminEmail !== "" &&
             accountEmail === configuredAdminEmail) ||
            userData.isAdmin === true;

        window.location.replace(isAdmin ? "admin.html" : "index.html");
    }

    // =====================================================
    // CONNEXION
    // =====================================================

    loginForm.addEventListener("submit", async event => {
        event.preventDefault();

        if (isSubmitting) return;

        loginError.textContent = "";
        isSubmitting = true;
        loginButton.disabled = true;
        loginButton.textContent = "Connexion en cours...";

        try {
            const email =
                document.getElementById("loginEmail").value.trim();

            // Ne pas supprimer les espaces du mot de passe :
            // ils peuvent en faire partie.
            const password =
                document.getElementById("loginPassword").value;

            const credential = await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            await handlePostAuthRedirection(credential.user);

        } catch (error) {
            console.error("Erreur de connexion :", error);

            const messages = {
                "auth/invalid-credential":
                    "Email ou mot de passe incorrect.",
                "auth/user-not-found":
                    "Aucun compte ne correspond à cet email.",
                "auth/wrong-password":
                    "Mot de passe incorrect.",
                "auth/invalid-email":
                    "Veuillez saisir une adresse email valide.",
                "auth/too-many-requests":
                    "Trop de tentatives. Réessayez plus tard.",
                "auth/network-request-failed":
                    "Connexion Internet indisponible. Vérifiez votre réseau."
            };

            if (error.code && messages[error.code]) {
                loginError.textContent = messages[error.code];
            } else if (error.code && error.code.startsWith("auth/")) {
                loginError.textContent =
                    "Connexion impossible : " + error.message;
            } else {
                loginError.textContent =
                    "Connexion réussie, mais la vérification du profil " +
                    "ou des droits administrateur a échoué. " +
                    "Vérifiez les règles Firebase Realtime Database.";
            }

        } finally {
            isSubmitting = false;
            loginButton.disabled = false;
            loginButton.textContent = "Se connecter";
        }
    });

    // =====================================================
    // INSCRIPTION
    // =====================================================

    registerForm.addEventListener("submit", async event => {
        event.preventDefault();

        if (isSubmitting) return;

        regError.textContent = "";

        const termsChecked =
            document.getElementById("termsCheckbox").checked;

        if (!termsChecked) {
            regError.textContent =
                "Veuillez accepter les conditions d'utilisation.";
            return;
        }

        const age = Number(document.getElementById("age").value);

        if (!Number.isInteger(age) || age < 18 || age > 120) {
            regError.textContent =
                "L'inscription est réservée aux personnes âgées de 18 ans ou plus.";
            return;
        }

        const password =
            document.getElementById("regPassword").value;

        if (password.length < 6) {
            regError.textContent =
                "Le mot de passe doit contenir au moins 6 caractères.";
            return;
        }

        const photoFile = profileImageInput.files?.[0];

        isSubmitting = true;
        registerButton.disabled = true;

        let accountCreated = false;

        try {
            let profilePhoto = "";

            // Étape 1 : préparer la photo localement, si elle existe.
            // Aucune dépendance à Cloudinary.
            if (photoFile) {
                registerButton.textContent = "Préparation de la photo...";
                profilePhoto = await compressImageToDataURL(photoFile);
            }

            // Étape 2 : créer le compte Firebase Authentication.
            registerButton.textContent = "Création du compte...";

            const email =
                document.getElementById("regEmail").value.trim();

            const credential = await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

            const user = credential.user;
            accountCreated = true;

            const phoneCode =
                document.getElementById("phoneCode").value;

            const phoneNumber =
                document.getElementById("whatsappNumber").value.trim();

            const fullPhoneNumber =
                `${phoneCode}${phoneNumber}`;

            // Étape 3 : enregistrer le profil et la photo dans Firebase RTDB.
            // La photo est une chaîne data:image/jpeg;base64,...
            // Le champ profileMediaUrl est conservé pour compatibilité.
            registerButton.textContent = "Enregistrement du profil...";

            const profileData = {
                uid: user.uid,
                fullName: document.getElementById("fullName").value.trim(),
                gender: document.getElementById("gender").value,
                city: document.getElementById("city").value.trim(),
                country: document.getElementById("countryInput").value.trim(),
                whatsappNumber: fullPhoneNumber,
                maritalStatus: document.getElementById("maritalStatus").value,
                age: age,
                email: user.email,
                profileMediaUrl: profilePhoto,
                acceptedTerms: true,
                createdAt: new Date().toISOString()
            };

            await set(ref(rtdb, `users/${user.uid}`), profileData);

            // Étape 4 : redirection après enregistrement réussi.
            registerButton.textContent = "Ouverture du profil...";

            await handlePostAuthRedirection(user);

        } catch (error) {
            console.error("Erreur d'inscription :", error);

            if (accountCreated) {
                regError.textContent =
                    "Le compte de connexion a été créé, mais l'enregistrement " +
                    "du profil ou la vérification des droits a échoué. " +
                    "Ne recréez pas un autre compte avec le même email. " +
                    "Vérifiez les règles de Firebase Realtime Database " +
                    "et la connexion Internet, puis corrigez le profil existant.";

            } else if (error.code === "auth/email-already-in-use") {
                regError.textContent =
                    "Cet email possède déjà un compte. Connectez-vous plutôt.";

            } else if (error.code === "auth/weak-password") {
                regError.textContent =
                    "Choisissez un mot de passe plus solide.";

            } else if (error.code === "auth/invalid-email") {
                regError.textContent =
                    "Veuillez saisir une adresse email valide.";

            } else if (error.code === "auth/network-request-failed") {
                regError.textContent =
                    "Connexion Internet indisponible. Vérifiez votre réseau.";

            } else if (error.code && error.code.startsWith("auth/")) {
                regError.textContent =
                    "Erreur de création du compte : " + error.message;

            } else {
                regError.textContent =
                    error.message ||
                    "Une erreur est survenue. Veuillez réessayer.";
            }

        } finally {
            isSubmitting = false;
            registerButton.disabled = false;
            registerButton.textContent = "Créer mon compte";
        }
    });
</script>
</body>
</html>
