<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Bébé - Connexion & Inscription</title>
    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-gold: #FFA500;
            --deep-red: #D32F2F;
            --dark-red: #B71C1C;
            --accent-blue: #0D47A1;
        }
        body {
            background: linear-gradient(135deg, var(--primary-gold) 0%, var(--dark-gold) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #FFFFFF;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            border: 4px solid var(--primary-gold);
            box-sizing: border-box;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-wrapper {
            width: 90px;
            height: 90px;
            margin: 0 auto;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--primary-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h2 {
            text-align: center;
            color: var(--deep-red);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: var(--accent-blue);
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--deep-red);
        }
        .password-container {
            position: relative;
        }
        .password-container input {
            padding-right: 40px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 55%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
        }
        .phone-group {
            display: flex;
            gap: 10px;
        }
        .phone-group select {
            flex: 1.3;
        }
        .phone-group input {
            flex: 1.7;
        }
        button[type="submit"] {
            background: linear-gradient(to right, var(--deep-red), var(--dark-red));
            color: #FFFFFF;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4);
        }
        button[type="submit"]:hover {
            opacity: 0.9;
        }
        .switch-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #333;
        }
        .switch-link span {
            color: var(--accent-blue);
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
        }
        .error-msg {
            color: var(--deep-red);
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-container">
            <div class="logo-wrapper">
                <img src="https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png" alt="Logo Love Bébé" crossorigin="anonymous">
            </div>
        </div>

        <h2 id="form-title">Connexion Love Bébé</h2>

        <!-- FORMULAIRE DE CONNEXION -->
        <form id="loginForm">
            <label>Email :</label>
            <input type="email" id="loginEmail" required placeholder="exemple@domaine.com">

            <label>Mot de passe :</label>
            <div class="password-container">
                <input type="password" id="loginPassword" required placeholder="••••••••">
                <span class="toggle-password" onclick="togglePasswordVisibility('loginPassword', this)">👁️</span>
            </div>

            <button type="submit">Se connecter</button>
            <div id="loginError" class="error-msg"></div>
        </form>

        <!-- FORMULAIRE D'INSCRIPTION -->
        <form id="registerForm" class="hidden">
            <label>Nom complet :</label>
            <input type="text" id="fullName" placeholder="Ex: Kouassi Jean">

            <label>Genre / Sexe :</label>
            <select id="gender" required>
                <option value="">Sélectionnez votre sexe</option>
                <option value="Masculin">Masculin (Homme)</option>
                <option value="Féminin">Féminin (Femme)</option>
            </select>

            <label>Ville :</label>
            <input type="text" id="city" placeholder="Ex: Cotonou / Abidjan">

            <label>Pays :</label>
            <select id="countrySelect">
                <option value="">Sélectionnez votre pays</option>
            </select>

            <label>Statut Matrimonial :</label>
            <select id="maritalStatus">
                <option value="Célibataire sans enfant">Célibataire sans enfant</option>
                <option value="Célibataire avec enfant(s)">Célibataire avec enfant(s)</option>
                <option value="Marié(e)">Marié(e)</option>
            </select>

            <label>Âge :</label>
            <input type="number" id="age" min="16" placeholder="Votre âge">

            <label>Email :</label>
            <input type="email" id="regEmail" placeholder="exemple@domaine.com">

            <label>Mot de passe :</label>
            <div class="password-container">
                <input type="password" id="regPassword" placeholder="••••••••">
                <span class="toggle-password" onclick="togglePasswordVisibility('regPassword', this)">👁️</span>
            </div>

            <label>Photo ou Vidéo de profil :</label>
            <input type="file" id="profileImage" accept="image/*,video/*">

            <button type="submit">S'inscrire</button>
            <div id="regError" class="error-msg"></div>
        </form>

        <div class="switch-link">
            <span id="toggleTextMsg">Pas encore de compte ?</span> <span id="toggleBtn">S'inscrire</span>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(fieldId, iconElement) {
            const field = document.getElementById(fieldId);
            if (field.type === "password") {
                field.type = "text";
                iconElement.textContent = "🙈";
            } else {
                field.type = "password";
                iconElement.textContent = "👁️";
            }
        }
    </script>

    <script type="module">
        import { auth, uploadMediaToCloudinary, checkAdminAndRedirect, rtdb } from "./love-bebe-service.js";
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { ref, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Chargement des pays
        async function loadCountries() {
            try {
                const response = await fetch('https://restcountries.com/v3.1/all?fields=name');
                const countries = await response.json();
                countries.sort((a, b) => a.name.common.localeCompare(b.name.common));
                const select = document.getElementById('countrySelect');
                countries.forEach(country => {
                    const option = document.createElement('option');
                    option.value = country.name.common;
                    option.textContent = country.name.common;
                    select.appendChild(option);
                });
            } catch (e) { console.error(e); }
        }
        loadCountries();

        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const formTitle = document.getElementById('form-title');
        const toggleBtn = document.getElementById('toggleBtn');
        const toggleTextMsg = document.getElementById('toggleTextMsg');
        let isLoginMode = true;

        toggleBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                formTitle.textContent = "Connexion Love Bébé";
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                toggleTextMsg.textContent = "Pas encore de compte ?";
                toggleBtn.textContent = "S'inscrire";
            } else {
                formTitle.textContent = "Inscription Love Bébé";
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                toggleTextMsg.textContent = "Déjà inscrit ?";
                toggleBtn.textContent = "Se connecter";
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const cred = await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value.trim(), document.getElementById('loginPassword').value.trim());
                await checkAdminAndRedirect(cred.user);
            } catch (err) {
                document.getElementById('loginError').textContent = "Erreur : " + err.message;
            }
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const mediaFile = document.getElementById('profileImage').files[0];
                let mediaUrl = "";
                if (mediaFile) {
                    mediaUrl = await uploadMediaToCloudinary(mediaFile);
                }

                const cred = await createUserWithEmailAndPassword(auth, document.getElementById('regEmail').value.trim(), document.getElementById('regPassword').value.trim());
                const user = cred.user;

                await update(ref(rtdb, `users/${user.uid}`), {
                    fullName: document.getElementById('fullName').value.trim(),
                    gender: document.getElementById('gender').value,
                    city: document.getElementById('city').value.trim(),
                    country: document.getElementById('countrySelect').value,
                    maritalStatus: document.getElementById('maritalStatus').value,
                    age: parseInt(document.getElementById('age').value) || 18,
                    email: user.email,
                    profileMediaUrl: mediaUrl,
                    createdAt: new Date().toISOString()
                });

                await checkAdminAndRedirect(user);
            } catch (err) {
                document.getElementById('regError').textContent = "Erreur : " + err.message;
            }
        });
    </script>
</body>
</html>
