<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Bébé - Connexion & Inscription Internationale</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFD700">

    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-gold: #FFA500;
            --deep-red: #D32F2F;
            --dark-red: #B71C1C;
            --accent-blue: #0D47A1;
        }
        body {
            background: linear-gradient(135deg, var(--primary-gold) 0%, var(--dark-gold) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #FFFFFF;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 520px;
            border: 4px solid var(--primary-gold);
            box-sizing: border-box;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-wrapper {
            width: 90px;
            height: 90px;
            margin: 0 auto;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--primary-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h2 {
            text-align: center;
            color: var(--deep-red);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: var(--accent-blue);
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--deep-red);
        }
        .password-container {
            position: relative;
        }
        .password-container input {
            padding-right: 40px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 55%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
        }
        .phone-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .phone-group select {
            flex: 1.6;
        }
        .phone-group input {
            flex: 1.4;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            font-size: 12px;
            color: #333;
        }
        .checkbox-container input {
            width: auto;
            margin: 0;
            cursor: pointer;
        }
        .checkbox-container a {
            color: var(--accent-blue);
            font-weight: bold;
            text-decoration: underline;
        }
        button[type="submit"] {
            background: linear-gradient(to right, var(--deep-red), var(--dark-red));
            color: #FFFFFF;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4);
        }
        button[type="submit"]:hover {
            opacity: 0.9;
        }
        .switch-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #333;
        }
        .switch-link span {
            color: var(--accent-blue);
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
        }
        .error-msg {
            color: var(--deep-red);
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
        .hidden {
            display: none;
        }
    </style>
</head>

    <script>
        function togglePasswordVisibility(fieldId, iconElement) {
            const field = document.getElementById(fieldId);
            if (field.type === "password") {
                field.type = "text";
                iconElement.textContent = "🙈";
            } else {
                field.type = "password";
                iconElement.textContent = "👁️";
            }
        }
    </script>

    <script type="module">
        import { auth, uploadMediaToCloudinary, rtdb } from "./love-bebe-service.js";
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const formTitle = document.getElementById('form-title');
        const toggleBtn = document.getElementById('toggleBtn');
        const toggleTextMsg = document.getElementById('toggleTextMsg');
        let isLoginMode = true;

        toggleBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                formTitle.textContent = "Connexion Love Bébé";
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                toggleTextMsg.textContent = "Pas encore de compte ?";
                toggleBtn.textContent = "S'inscrire";
            } else {
                formTitle.textContent = "Inscription Love Bébé";
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                toggleTextMsg.textContent = "Déjà inscrit ?";
                toggleBtn.textContent = "Se connecter";
            }
        });

        async function handlePostAuthRedirection(user) {
            try {
                const userSnap = await get(ref(rtdb, `users/${user.uid}`));
                const adminSnap = await get(ref(rtdb, 'config/admin'));

                let isAdmin = false;
                if (adminSnap.exists() && adminSnap.val().email.toLowerCase() === user.email.toLowerCase()) {
                    isAdmin = true;
                }
                if (userSnap.exists() && userSnap.val().isAdmin === true) {
                    isAdmin = true;
                }

                if (isAdmin) {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "index.html";
                }
            } catch (err) {
                window.location.href = "index.html";
            }
        }

        // Connexion
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const errDiv = document.getElementById('loginError');
            errDiv.textContent = "";

            try {
                const cred = await signInWithEmailAndPassword(
                    auth, 
                    document.getElementById('loginEmail').value.trim(), 
                    document.getElementById('loginPassword').value.trim()
                );
                await handlePostAuthRedirection(cred.user);
            } catch (err) {
                errDiv.textContent = "Erreur de connexion : " + err.message;
            }
        });

        // Inscription avec gestion d'erreur Cloudinary détaillée
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const errDiv = document.getElementById('regError');
            errDiv.textContent = "";

            const termsChecked = document.getElementById('termsCheckbox').checked;
            if (!termsChecked) {
                errDiv.textContent = "⚠️ Veuillez accepter les conditions d'utilisation et la politique de confidentialité.";
                return;
            }

            const ageVal = parseInt(document.getElementById('age').value);
            if (isNaN(ageVal) || ageVal < 18) {
                errDiv.textContent = "⛔ Inscription refusée : Vous devez avoir au moins 18 ans pour accéder à Love Bébé.";
                return;
            }

            try {
                const mediaFile = document.getElementById('profileImage').files[0];
                let mediaUrl = "https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png";

                if (mediaFile) {
                    errDiv.style.color = "#0D47A1";
                    errDiv.textContent = "Téléversement de la photo de profil en cours...";
                    try {
                        mediaUrl = await uploadMediaToCloudinary(mediaFile);
                    } catch (uploadErr) {
                        console.error("Cloudinary error:", uploadErr);
                        errDiv.style.color = "#D32F2F";
                        errDiv.textContent = "Erreur de téléversement média : Vérifiez votre preset Cloudinary.";
                        return;
                    }
                }

                errDiv.style.color = "#0D47A1";
                errDiv.textContent = "Création du compte utilisateur...";

                const cred = await createUserWithEmailAndPassword(
                    auth, 
                    document.getElementById('regEmail').value.trim(), 
                    document.getElementById('regPassword').value.trim()
                );
                const user = cred.user;

                const fullPhoneNumber = document.getElementById('phoneCode').value + document.getElementById('whatsappNumber').value.trim();

                await update(ref(rtdb, `users/${user.uid}`), {
                    fullName: document.getElementById('fullName').value.trim(),
                    gender: document.getElementById('gender').value,
                    city: document.getElementById('city').value.trim(),
                    country: document.getElementById('countryInput').value.trim(),
                    whatsappNumber: fullPhoneNumber,
                    maritalStatus: document.getElementById('maritalStatus').value,
                    age: ageVal,
                    email: user.email,
                    profileMediaUrl: mediaUrl,
                    acceptedTerms: true,
                    createdAt: new Date().toISOString()
                });

                await handlePostAuthRedirection(user);
            } catch (err) {
                errDiv.style.color = "#D32F2F";
                errDiv.textContent = "Erreur d'inscription : " + err.message;
            }
        });
    </script>
</body>
