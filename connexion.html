<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Bébé - Connexion</title>
    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-gold: #FFA500;
            --deep-red: #D32F2F;
            --dark-red: #B71C1C;
            --accent-blue: #0D47A1;
        }
        body {
            background: linear-gradient(135deg, var(--primary-gold) 0%, var(--dark-gold) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }
        .card {
            background: #FFFFFF; padding: 30px; border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); width: 100%; max-width: 500px;
            border: 4px solid var(--primary-gold); box-sizing: border-box;
        }
        .logo-container { text-align: center; margin-bottom: 15px; }
        .logo-wrapper {
            width: 90px; height: 90px; margin: 0 auto; border-radius: 50%;
            background: #fff; border: 3px solid var(--primary-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .logo-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        h2 { text-align: center; color: var(--deep-red); text-transform: uppercase; margin-bottom: 20px; font-size: 1.4rem; }
        label { display: block; margin-top: 10px; font-weight: bold; color: var(--accent-blue); font-size: 13px; }
        input { width: 100%; padding: 11px; margin-top: 5px; border: 2px solid #E0E0E0; border-radius: 8px; font-size: 14px; }
        input:focus { outline: none; border-color: var(--deep-red); }
        .password-container { position: relative; }
        .password-container input { padding-right: 40px; }
        .toggle-password { position: absolute; right: 12px; top: 55%; transform: translateY(-50%); cursor: pointer; }
        button[type="submit"] {
            background: linear-gradient(to right, var(--deep-red), var(--dark-red));
            color: #FFFFFF; border: none; padding: 13px; width: 100%;
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px;
        }
        .switch-link { text-align: center; margin-top: 18px; font-size: 14px; }
        .switch-link a { color: var(--accent-blue); font-weight: bold; text-decoration: underline; }
        .error-msg { color: var(--deep-red); font-size: 13px; text-align: center; margin-top: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-container">
            <div class="logo-wrapper">
                <img src="https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png" alt="Logo Love Bébé" crossorigin="anonymous">
            </div>
        </div>

        <h2>Connexion Love Bébé</h2>

        <form id="loginForm">
            <label>Email :</label>
            <input type="email" id="loginEmail" required placeholder="exemple@domaine.com">

            <label>Mot de passe :</label>
            <div class="password-container">
                <input type="password" id="loginPassword" required placeholder="••••••••">
                <span class="toggle-password" onclick="togglePasswordVisibility('loginPassword', this)">👁️</span>
            </div>

            <button type="submit" id="btnLogin">Se connecter</button>
            <div id="loginError" class="error-msg"></div>
        </form>

        <div class="switch-link">
            <span>Pas encore de compte ?</span> <a href="inscription.html">S'inscrire</a>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(fieldId, iconElement) {
            const field = document.getElementById(fieldId);
            field.type = field.type === "password" ? "text" : "password";
            iconElement.textContent = field.type === "password" ? "👁️" : "🙈";
        }
    </script>

    <script type="module">
        import { auth } from "./love-bebe-service.js";
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.textContent = "";
            const btnLogin = document.getElementById('btnLogin');

            try {
                btnLogin.disabled = true;
                btnLogin.textContent = "Connexion en cours...";

                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value.trim();

                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "index.html";
            } catch (err) {
                let errorMsg = err.message;
                if (err.code === "auth/invalid-credential" || err.code === "auth/user-not-found" || err.code === "auth/wrong-password") {
                    errorMsg = "Email ou mot de passe incorrect.";
                }
                loginError.textContent = errorMsg;
            } finally {
                btnLogin.disabled = false;
                btnLogin.textContent = "Se connecter";
            }
        });
    </script>
</body>
</html>
