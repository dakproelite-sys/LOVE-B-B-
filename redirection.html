<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Bébé - Redirection en cours...</title>
    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-gold: #FFA500;
            --deep-red: #D32F2F;
            --dark-red: #B71C1C;
            --accent-blue: #0D47A1;
        }
        body {
            background: linear-gradient(135deg, var(--primary-gold) 0%, var(--dark-gold) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #FFFFFF;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            border: 4px solid var(--primary-gold);
            box-sizing: border-box;
            text-align: center;
        }
        .logo-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--primary-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h2 {
            color: var(--deep-red);
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
        }
        /* Spinner élégant qui tourne en bas */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--deep-red);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-msg {
            color: var(--deep-red);
            font-size: 13px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-wrapper">
            <img src="https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png" alt="Logo Love Bébé" crossorigin="anonymous">
        </div>

        <h2>Patientez un instant</h2>
        <p>Vérification de votre profil et redirection sécurisée...</p>

        <!-- Animation de chargement discrète -->
        <div class="spinner"></div>
        <div id="redirectError" class="error-msg"></div>
    </div>

    <script type="module">
        import { auth, database } from "./firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const errorDiv = document.getElementById('redirectError');

        // Écouteur d'état d'authentification Firebase sécurisé
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    // Récupération des données de l'utilisateur dans Realtime Database
                    const dbRef = ref(database);
                    const snapshot = await get(child(dbRef, `users/${user.uid}`));

                    if (snapshot.exists()) {
                        const userData = snapshot.val();
                        
                        // Vérification dynamique du rôle (Admin vs Utilisateur classique)
                        if (userData.role && userData.role === "admin") {
                            // Redirection vers la page d'administration
                            window.location.replace("admin.html");
                        } else {
                            // Redirection vers le profil personnel de l'utilisateur
                            window.location.replace("mon-profil.html");
                        }
                    } else {
                        // Si l'utilisateur est authentifié mais sans données de profil dans la DB
                        window.location.replace("mon-profil.html");
                    }
                } catch (error) {
                    console.error("Erreur lors de la redirection :", error);
                    errorDiv.textContent = "Erreur de chargement du profil. Redirection vers la connexion...";
                    setTimeout(() => {
                        window.location.replace("connexion.html");
                    }, 2000);
                }
            } else {
                // Aucun utilisateur connecté, redirection de sécurité vers la page de connexion
                window.location.replace("connexion.html");
            }
        });
    </script>
</body>
</html>
