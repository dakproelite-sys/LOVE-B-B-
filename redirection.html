<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Bébé - Vérification du compte...</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFD700">

    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-gold: #FFA500;
            --deep-red: #D32F2F;
            --accent-blue: #0D47A1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary-gold) 0%, var(--dark-gold) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .loader-card {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 4px solid var(--primary-gold);
        }

        .logo-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            border: 3px solid var(--deep-red);
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #E0E0E0;
            border-top: 5px solid var(--deep-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            color: var(--deep-red);
            font-size: 1.3rem;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        p {
            color: var(--accent-blue);
            font-size: 14px;
            font-weight: 600;
        }

        .error-btn {
            display: none;
            margin-top: 20px;
            background: var(--deep-red);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="loader-card">
        <div class="logo-wrapper">
            <img src="https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png" alt="Love Bébé">
        </div>
        <h2>Love Bébé</h2>
        <div class="spinner" id="spinner"></div>
        <p id="statusMsg">Vérification de l'authentification et du rôle...</p>
        <a href="connexion.html" id="errorBtn" class="error-btn">🔑 Aller à la Connexion</a>
    </div>

    <script type="module">
        import { auth, database, onAuthStateChanged, ref, get, child } from "./love-bebe-service.js";

        const statusMsg = document.getElementById('statusMsg');
        const spinner = document.getElementById('spinner');
        const errorBtn = document.getElementById('errorBtn');

        // Vérification dynamique lors du chargement
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                // Non connecté dans Firebase Auth -> Expulsion
                showError("Accès refusé : Aucun utilisateur connecté.");
                setTimeout(() => window.location.replace("connexion.html"), 1200);
                return;
            }

            try {
                statusMsg.textContent = "Vérification de votre profil dans la base de données...";

                // Lecture du nœud de l'utilisateur dans Realtime Database
                const dbRef = ref(database);
                const userSnapshot = await get(child(dbRef, `users/${user.uid}`));

                if (!userSnapshot.exists()) {
                    // Authentifié mais absent de la base Realtime Database -> Compte incomplet
                    showError("Profil non trouvé dans la base de données. Veuillez créer votre compte.");
                    setTimeout(() => window.location.replace("inscription.html"), 2000);
                    return;
                }

                const userData = userSnapshot.val();

                // Contrôle d'accès et attribution du rôle
                statusMsg.textContent = "Accès autorisé ! Redirection en cours...";

                if (userData.isAdmin === true || userData.role === "admin" || userData.role === "Super Admin") {
                    // Direction l'Espace Administration
                    window.location.replace("admin.html");
                } else {
                    // Direction l'Espace Membre Profil
                    window.location.replace("mon-profil.html");
                }

            } catch (error) {
                console.error("Erreur de redirection :", error);
                showError("Erreur de connexion à la base de données : " + error.message);
            }
        });

        function showError(msg) {
            spinner.style.display = "none";
            statusMsg.style.color = "#D32F2F";
            statusMsg.textContent = msg;
            errorBtn.style.display = "inline-block";
        }
    </script>
</body>
</html>
