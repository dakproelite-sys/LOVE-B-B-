<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Love Bébé - Plateforme de rencontres.">
    <meta name="theme-color" content="#FFD700">
    <title>Love Bébé - L'Élite des Rencontres</title>

    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-gold: #FFA500;
            --deep-red: #D32F2F;
            --dark-red: #B71C1C;
            --accent-blue: #0D47A1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary-gold), var(--dark-gold));
            min-height: 100vh;
            padding-bottom: 40px;
            color: #222;
        }

        header {
            background: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 3px solid var(--deep-red);
            box-shadow: 0 4px 10px #0002;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .header-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--primary-gold);
            object-fit: cover;
        }

        .header-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--deep-red);
            text-transform: uppercase;
        }

        .nav-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .nav-btn {
            background: linear-gradient(135deg, var(--deep-red), var(--dark-red));
            color: white;
            padding: 9px 14px;
            border-radius: 20px;
            font-weight: bold;
            text-decoration: none;
            font-size: 13px;
            border: none;
            cursor: pointer;
        }

        .nav-btn-blue {
            background: linear-gradient(135deg, var(--accent-blue), #1565C0);
        }

        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .hero-banner, .publication-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid var(--primary-gold);
            box-shadow: 0 4px 15px #0002;
            margin-bottom: 20px;
        }

        .hero-banner {
            text-align: center;
        }

        .hero-banner h1, .publication-card h3 {
            color: var(--deep-red);
            margin-bottom: 8px;
        }

        .hero-banner p {
            color: var(--accent-blue);
            font-weight: 500;
        }

        .admin-publications-container {
            display: none;
            margin-bottom: 25px;
        }

        .publication-card p {
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .publication-media {
            display: block;
            width: 100%;
            max-height: 350px;
            object-fit: contain;
            border-radius: 10px;
            margin-top: 10px;
            background: #f5f5f5;
        }

        .filter-section {
            background: white;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid var(--primary-gold);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-input, .filter-select {
            flex: 1;
            min-width: 150px;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .filter-input:focus, .filter-select:focus {
            outline: none;
            border-color: var(--deep-red);
        }

        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: 18px;
        }

        @media (min-width: 550px) {
            .profiles-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (min-width: 850px) {
            .profiles-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        }

        @media (min-width: 1200px) {
            .profiles-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
        }

        .profile-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid var(--primary-gold);
            box-shadow: 0 4px 12px #0002;
            display: flex;
            flex-direction: column;
        }

        .profile-media {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #eee;
        }

        .profile-content {
            padding: 12px;
            flex: 1;
        }

        .profile-name {
            font-size: 1rem;
            color: var(--deep-red);
            font-weight: bold;
            margin-bottom: 8px;
            overflow-wrap: anywhere;
        }

        .profile-detail {
            font-size: 12px;
            color: #444;
            margin-bottom: 5px;
            overflow-wrap: anywhere;
        }

        .card-actions {
            padding: 10px;
            border-top: 1px solid #eee;
            background: #fafafa;
        }

        .action-btn {
            width: 100%;
            padding: 9px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
            text-decoration: none;
            color: white;
            background: var(--deep-red);
            display: block;
        }

        .status-message {
            text-align: center;
            grid-column: 1 / -1;
            padding: 20px;
            font-weight: bold;
            color: var(--accent-blue);
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
<header>
    <a href="index.html" class="header-brand">
        <img
            src="https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png"
            alt="Logo Love Bébé"
            class="header-logo"
        >
        <span class="header-title">Love Bébé</span>
    </a>

    <nav class="nav-actions">
        <a href="profil.html" id="profile-nav-btn" class="nav-btn nav-btn-blue">
            👤 Mon Profil
        </a>
        <button class="nav-btn" id="auth-btn" type="button">
            🚪 Déconnexion
        </button>
    </nav>
</header>

<main class="container">
    <section class="hero-banner">
        <h1>L'Amour Véritable Vous Attend ❤️</h1>
        <p>Découvrez les profils de nos célibataires inscrits.</p>
    </section>

    <section
        id="adminPublicationsSection"
        class="admin-publications-container"
        aria-label="Annonces officielles"
    ></section>

    <section class="filter-section" aria-label="Filtres de recherche">
        <input
            type="search"
            id="searchInput"
            class="filter-input"
            placeholder="🔍 Rechercher par nom, ville ou pays..."
            aria-label="Rechercher un profil"
        >

        <select id="genderFilter" class="filter-select" aria-label="Filtrer par genre">
            <option value="">Tous les genres</option>
            <option value="Masculin">Hommes uniquement</option>
            <option value="Féminin">Femmes uniquement</option>
        </select>

        <select id="ageFilter" class="filter-select" aria-label="Filtrer par âge">
            <option value="">Toutes les tranches d'âge</option>
            <option value="18-25">18 - 25 ans</option>
            <option value="26-30">26 - 30 ans</option>
            <option value="31-35">31 - 35 ans</option>
            <option value="36-40">36 - 40 ans</option>
            <option value="41-45">41 - 45 ans</option>
            <option value="46+">46 ans et plus</option>
        </select>
    </section>

    <section
        id="profilesContainer"
        class="profiles-grid"
        aria-live="polite"
        aria-label="Profils disponibles"
    >
        <p class="status-message">Vérification de la connexion...</p>
    </section>
</main>

<script type="module">
    import { auth, database } from "./love-bebe-service.js";

    import {
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
        ref,
        get
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const authBtn = document.getElementById("auth-btn");
    const profileNavBtn = document.getElementById("profile-nav-btn");
    const profilesContainer = document.getElementById("profilesContainer");
    const publicationsContainer = document.getElementById("adminPublicationsSection");

    let allUsersData = {};
    let currentUserId = null;
    let isAdmin = false;
    let accessChecked = false;

    const fallbackImage =
        "https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png";

    function showMessage(container, message) {
        container.replaceChildren();

        const paragraph = document.createElement("p");
        paragraph.className = "status-message";
        paragraph.textContent = message;

        container.appendChild(paragraph);
    }

    function isAdministrator(userData) {
        if (!userData) return false;

        return userData.isAdmin === true ||
            userData.role === "admin" ||
            userData.role === "Super Admin";
    }

    function safeMediaUrl(value) {
        if (typeof value !== "string" || !value.trim()) {
            return "";
        }

        try {
            const url = new URL(value, window.location.href);

            if (url.protocol === "https:" || url.protocol === "http:") {
                return url.href;
            }
        } catch (error) {
            console.warn("Adresse média invalide.");
        }

        return "";
    }

    function addText(parent, tag, className, text) {
        const element = document.createElement(tag);
        element.className = className;
        element.textContent = String(text ?? "");
        parent.appendChild(element);
        return element;
    }

    // Vérification obligatoire de la connexion Firebase.
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.replace("connexion.html");
            return;
        }

        currentUserId = user.uid;
        accessChecked = false;

        authBtn.disabled = true;
        authBtn.textContent = "Vérification...";
        showMessage(profilesContainer, "Vérification de votre compte...");

        try {
            const userSnapshot = await get(ref(database, `users/${user.uid}`));

            if (!userSnapshot.exists()) {
                await signOut(auth);
                window.location.replace("connexion.html");
                return;
            }

            const userData = userSnapshot.val();
            isAdmin = isAdministrator(userData);
            accessChecked = true;

            if (isAdmin) {
                profileNavBtn.textContent = "⚙️ Administration";
                profileNavBtn.href = "admin.html";
            } else {
                profileNavBtn.textContent = "👤 Mon Profil";
                profileNavBtn.href = "profil.html";
            }

            authBtn.disabled = false;
            authBtn.textContent = "🚪 Déconnexion";

            authBtn.onclick = async () => {
                authBtn.disabled = true;

                try {
                    await signOut(auth);
                    window.location.replace("connexion.html");
                } catch (error) {
                    console.error("Erreur de déconnexion :", error);
                    authBtn.disabled = false;
                    alert("La déconnexion a échoué. Veuillez réessayer.");
                }
            };

            await Promise.all([
                fetchAdminPublications(),
                fetchProfiles()
            ]);

        } catch (error) {
            console.error("Erreur de vérification du compte :", error);

            showMessage(
                profilesContainer,
                "Impossible de vérifier votre compte. Vérifiez votre connexion et les règles Firebase."
            );

            authBtn.disabled = false;
            authBtn.textContent = "🚪 Déconnexion";
        }
    });

    // Affichage des annonces.
    async function fetchAdminPublications() {
        publicationsContainer.replaceChildren();
        publicationsContainer.style.display = "none";

        try {
            const snapshot = await get(ref(database, "publications"));

            if (!snapshot.exists()) return;

            const publications = snapshot.val();

            const entries = Object.entries(publications).reverse();

            for (const [id, publication] of entries) {
                if (!publication || typeof publication !== "object") continue;

                const card = document.createElement("article");
                card.className = "publication-card";

                addText(
                    card,
                    "h3",
                    "",
                    "📢 " + (publication.title || "Annonce officielle Love Bébé")
                );

                addText(card, "p", "", publication.content || "");

                const mediaUrl = safeMediaUrl(publication.mediaUrl);

                if (mediaUrl) {
                    let media;

                    if (publication.mediaType === "video") {
                        media = document.createElement("video");
                        media.controls = true;
                    } else {
                        media = document.createElement("img");
                        media.alt = "Illustration de l'annonce";
                    }

                    media.className = "publication-media";
                    media.src = mediaUrl;
                    media.loading = "lazy";
                    card.appendChild(media);
                }

                const timestamp = Number(publication.createdAt);
                const date = document.createElement("p");
                date.style.cssText = "font-size:11px;color:#777;margin-top:8px;";

                if (Number.isFinite(timestamp) && timestamp > 0) {
                    date.textContent = "Publié le " +
                        new Date(timestamp).toLocaleDateString("fr-FR");
                } else {
                    date.textContent = "Annonce officielle";
                }

                card.appendChild(date);
                publicationsContainer.appendChild(card);
            }

            if (publicationsContainer.childElementCount > 0) {
                publicationsContainer.style.display = "block";
            }
        } catch (error) {
            console.error("Erreur de chargement des annonces :", error);
        }
    }

    // Chargement des profils. Ne jamais afficher ses propres coordonnées.
    async function fetchProfiles() {
        if (!accessChecked || !currentUserId) return;

        try {
            const snapshot = await get(ref(database, "users"));

            if (!snapshot.exists()) {
                allUsersData = {};
                renderProfiles();
                return;
            }

            allUsersData = snapshot.val() || {};
            renderProfiles();

        } catch (error) {
            console.error("Erreur de chargement des profils :", error);

            showMessage(
                profilesContainer,
                "Impossible de charger les profils. Vérifiez les règles de la base de données Firebase."
            );
        }
    }

    function renderProfiles() {
        if (!accessChecked) return;

        profilesContainer.replaceChildren();

        const searchValue = document
            .getElementById("searchInput").value.toLowerCase().trim();

        const genderValue = document.getElementById("genderFilter").value;
        const ageValue = document.getElementById("ageFilter").value;

        let count = 0;

        for (const [uid, user] of Object.entries(allUsersData)) {
            if (!user || typeof user !== "object") continue;

            // Ne pas afficher son propre compte ni les administrateurs.
            if (uid === currentUserId || isAdministrator(user)) continue;

            const name = String(user.fullName || "Membre Love Bébé");
            const city = String(user.city || "");
            const country = String(user.country || "");
            const gender = String(user.gender || "");
            const ageNumber = Number.parseInt(user.age, 10);

            const searchText = `${name} ${city} ${country}`.toLowerCase();

            if (searchValue && !searchText.includes(searchValue)) continue;
            if (genderValue && gender !== genderValue) continue;

            if (ageValue) {
                if (!Number.isFinite(ageNumber)) continue;

                if (ageValue === "18-25" && (ageNumber < 18 || ageNumber > 25)) continue;
                if (ageValue === "26-30" && (ageNumber < 26 || ageNumber > 30)) continue;
                if (ageValue === "31-35" && (ageNumber < 31 || ageNumber > 35)) continue;
                if (ageValue === "36-40" && (ageNumber < 36 || ageNumber > 40)) continue;
                if (ageValue === "41-45" && (ageNumber < 41 || ageNumber > 45)) continue;
                if (ageValue === "46+" && ageNumber < 46) continue;
            }

            const card = document.createElement("article");
            card.className = "profile-card";

            const image = document.createElement("img");
            image.className = "profile-media";
            image.alt = "Photo de " + name;
            image.loading = "lazy";

            const photos = Array.isArray(user.capturedPhotos)
                ? user.capturedPhotos
                : [];

            image.src =
                safeMediaUrl(photos[0]) ||
                safeMediaUrl(user.profileMediaUrl) ||
                fallbackImage;

            image.onerror = () => {
                image.onerror = null;
                image.src = fallbackImage;
            };

            card.appendChild(image);

            const content = document.createElement("div");
            content.className = "profile-content";

            addText(content, "div", "profile-name", name);

            addText(
                content,
                "div",
                "profile-detail",
                "📍 " + [city, country].filter(Boolean).join(", ")
            );

            addText(
                content,
                "div",
                "profile-detail",
                "🎂 " + (Number.isFinite(ageNumber) ? ageNumber + " ans" : "Âge non précisé")
            );

            addText(
                content,
                "div",
                "profile-detail",
                "💍 " + String(user.maritalStatus || "Statut non précisé")
            );

            card.appendChild(content);

            const actions = document.createElement("div");
            actions.className = "card-actions";

            const link = document.createElement("a");
            link.className = "action-btn";
            link.href = "profil.html?id=" + encodeURIComponent(uid);
            link.textContent = "👀 Voir le profil";

            actions.appendChild(link);
            card.appendChild(actions);
            profilesContainer.appendChild(card);

            count++;
        }

        if (count === 0) {
            showMessage(
                profilesContainer,
                Object.keys(allUsersData).length
                    ? "Aucun profil ne correspond à vos critères."
                    : "Aucun profil disponible pour le moment."
            );
        }
    }

    document.getElementById("searchInput").addEventListener("input", renderProfiles);
    document.getElementById("genderFilter").addEventListener("change", renderProfiles);
    document.getElementById("ageFilter").addEventListener("change", renderProfiles);
</script>
</body>
</html>
