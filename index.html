<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Love Bébé - Plateforme de rencontre internationale de haut prestige. Trouvez votre âme sœur, profils certifiés, relations sérieuses et mariages.">
    <meta name="keywords" content="Love Bébé, rencontre célibataires, mariage, amour, recherche âme sœur, Afrique rencontre">
    <meta name="author" content="DAKPROELITE">
    <meta name="robots" content="index, follow">
    <title>Love Bébé - L'Élite des Rencontres & Âmes Sœurs</title>

    <!-- Support PWA Natif & Thème -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFD700">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png">

    <!-- Fichier CSS Externe -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- En-tête Officiel -->
    <header>
        <a href="index.html" class="header-brand">
            <img src="https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png" alt="Logo Love Bébé" class="header-logo">
            <span class="header-title">Love Bébé</span>
        </a>
        <div class="nav-actions">
            <a href="mon-profil.html" class="nav-btn nav-btn-secondary">👤 Mon Profil</a>
            <a href="connexion.html" class="nav-btn" id="auth-btn">🔐 Connexion</a>
        </div>
    </header>

    <!-- Zone Principale -->
    <div class="container">
        
        <!-- Bannière d'Accueil -->
        <div class="hero-banner">
            <h1>L'Amour Véritable Vous Attend ❤️</h1>
            <p>Rencontrez des célibataires distingués, prêts pour un engagement sincère et durable.</p>
        </div>

        <!-- Filtre de Recherche Avancé -->
        <div class="filter-section">
            <div class="filter-group">
                <input type="text" id="searchInput" class="filter-input" placeholder="🔍 Chercher par ville ou nom...">
                <select id="ageFilter" class="filter-select">
                    <option value="">Toutes les tranches d'âge</option>
                    <option value="18-25">18 - 25 ans</option>
                    <option value="25-30">25 - 30 ans</option>
                    <option value="30-35">30 - 35 ans</option>
                    <option value="35-40">35 - 40 ans</option>
                    <option value="40-45">40 - 45 ans</option>
                    <option value="45-50">45 - 50 ans</option>
                    <option value="50-55">50 - 55 ans</option>
                    <option value="55+">55 ans et plus</option>
                </select>
            </div>
        </div>

        <!-- Conteneur Dynamique des Profils -->
        <div id="profilesContainer" class="profiles-grid">
            <p style="text-align:center; grid-column: 1/-1; font-weight:bold; color:#0D47A1; padding: 40px;">Chargement des célibataires en cours...</p>
        </div>

    </div>

    <!-- Logique JS Firebase & PWA -->
    <script type="module">
        import { auth, rtdb } from "./love-bebe-service.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        let allUsersData = {};

        // Suivi de l'authentification
        const authBtn = document.getElementById('auth-btn');
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authBtn.textContent = "🚪 Déconnexion";
                authBtn.href = "#";
                authBtn.onclick = async () => {
                    await signOut(auth);
                    window.location.reload();
                };
            } else {
                authBtn.textContent = "🔐 Connexion";
                authBtn.href = "connexion.html";
            }
        });

        // Chargement des Profils depuis Firebase Realtime Database
        async function fetchProfiles() {
            const container = document.getElementById('profilesContainer');
            try {
                const usersRef = ref(rtdb, 'users');
                const snapshot = await get(usersRef);

                if (!snapshot.exists()) {
                    container.innerHTML = "<p style='text-align:center; grid-column: 1/-1; font-weight:bold; color:#D32F2F;'>Aucun profil disponible pour le moment.</p>";
                    return;
                }

                allUsersData = snapshot.val();
                renderProfiles(allUsersData);

            } catch (error) {
                console.error("Erreur de chargement des profils :", error);
                container.innerHTML = "<p style='text-align:center; grid-column: 1/-1; color:#D32F2F;'>Erreur de chargement des données.</p>";
            }
        }

        // Rendu Dynamique HTML des Cartes Célibataires
        function renderProfiles(data) {
            const container = document.getElementById('profilesContainer');
            container.innerHTML = "";

            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const ageVal = document.getElementById('ageFilter').value;

            let count = 0;

            Object.keys(data).forEach(uid => {
                const user = data[uid];
                
                // Exclure les comptes administrateurs
                if (user.isAdmin) return;

                const name = user.fullName || 'Célibataire Love Bébé';
                const city = user.city || '';
                const country = user.country || '';
                const targetAge = user.targetAge || '';

                // Application des filtres
                if (searchVal && !name.toLowerCase().includes(searchVal) && !city.toLowerCase().includes(searchVal) && !country.toLowerCase().includes(searchVal)) {
                    return;
                }

                if (ageVal && targetAge !== ageVal) {
                    return;
                }

                count++;
                const mediaUrl = user.profileMediaUrl || 'https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png';
                const isVideo = mediaUrl.endsWith('.mp4') || mediaUrl.endsWith('.webm') || mediaUrl.includes('/video/upload/');

                const card = document.createElement('div');
                card.className = 'profile-card';
                card.innerHTML = `
                    <span class="badge-verified">✓ Profil Vérifié</span>
                    <div class="media-container">
                        ${isVideo 
                            ? `<video src="${mediaUrl}" class="profile-media" controls autoplay muted loop></video>`
                            : `<img src="${mediaUrl}" alt="${name}" class="profile-media" loading="lazy">`
                        }
                    </div>
                    <div class="profile-content">
                        <div>
                            <div class="profile-name-age">
                                <span>${name}</span>
                                <span>${user.age ? user.age + ' ans' : ''}</span>
                            </div>
                            <div class="profile-detail">📍 <strong>Localisation :</strong> ${city}${city && country ? ', ' : ''}${country}</div>
                            <div class="profile-detail">🎯 <strong>Recherche Femme :</strong> ${targetAge || 'Non précisé'}</div>
                            <div class="profile-detail">💍 <strong>Objectif :</strong> ${user.soulMateType || 'Relation sérieuse'}</div>
                            <div class="profile-quote">"${user.nationalitySearch || 'Prêt(e) à écrire une belle histoire d\'amour...'}"</div>
                        </div>
                        <div class="card-actions">
                            <a href="mon-profil.html?id=${uid}" class="action-btn btn-view">👁️ Voir Profil</a>
                            <a href="paiement.html?id=${uid}" class="action-btn btn-connect">💬 Contacter</a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            if (count === 0) {
                container.innerHTML = "<p style='text-align:center; grid-column: 1/-1; font-weight:bold; color:#D32F2F;'>Aucun profil ne correspond à vos critères de recherche.</p>";
            }
        }

        // Écouteurs pour les Filtres
        document.getElementById('searchInput').addEventListener('input', () => renderProfiles(allUsersData));
        document.getElementById('ageFilter').addEventListener('change', () => renderProfiles(allUsersData));

        // Invocations au chargement
        fetchProfiles();

        // Enregistrement PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('Erreur SW:', err));
            });
        }
    </script>
</body>
</html>
