<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Love Bébé - Plateforme de rencontre internationale de haut prestige.">
    <title>Love Bébé - L'Élite des Rencontres</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFD700">

    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-gold: #FFA500;
            --deep-red: #D32F2F;
            --dark-red: #B71C1C;
            --accent-blue: #0D47A1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary-gold) 0%, var(--dark-gold) 100%);
            min-height: 100vh;
            color: #222;
            display: flex;
            flex-direction: column;
        }

        /* EN-TÊTE */
        header {
            background: #ffffff;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            border-bottom: 4px solid var(--deep-red);
            box-shadow: 0 6px 20px rgba(0,0,0,0.18);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .header-logo {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 3px solid var(--primary-gold);
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .header-title {
            font-size: 2rem;
            font-weight: 900;
            color: var(--deep-red);
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .header-subtitle {
            font-size: 11px;
            color: var(--accent-blue);
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 450px;
        }

        .nav-btn {
            flex: 1;
            background: linear-gradient(135deg, var(--deep-red), var(--dark-red));
            color: white;
            padding: 10px 14px;
            border-radius: 25px;
            font-weight: 700;
            text-decoration: none;
            font-size: 14px;
            border: none;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        .nav-btn-blue {
            background: linear-gradient(135deg, var(--accent-blue), #1565C0);
        }

        @media (min-width: 768px) {
            header {
                flex-direction: row;
                justify-content: space-between;
                padding: 15px 35px;
            }
            .header-top { width: auto; justify-content: flex-start; }
            .brand-text { text-align: left; }
            .nav-actions { width: auto; }
            .nav-btn { flex: initial; padding: 10px 20px; }
        }

        .container {
            max-width: 1400px;
            margin: 25px auto;
            padding: 0 15px;
            flex: 1;
            width: 100%;
        }

        .hero-banner {
            background: #ffffff;
            border-radius: 16px;
            padding: 25px 15px;
            text-align: center;
            border: 2px solid var(--primary-gold);
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .hero-banner h1 {
            color: var(--deep-red);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .hero-banner p {
            color: var(--accent-blue);
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* FILTRES DE RECHERCHE */
        .filter-section {
            background: #fff;
            padding: 15px;
            border-radius: 14px;
            border: 2px solid var(--primary-gold);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (min-width: 600px) {
            .filter-section { flex-direction: row; flex-wrap: wrap; }
        }

        .filter-input, .filter-select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            font-size: 14px;
            background: #fcfcfc;
        }

        @media (min-width: 600px) {
            .filter-input, .filter-select { flex: 1; min-width: 180px; }
        }

        /* GRILLES */
        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 18px;
        }

        @media (min-width: 550px) {
            .profiles-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (min-width: 900px) {
            .profiles-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (min-width: 1200px) {
            .profiles-grid { grid-template-columns: repeat(5, 1fr); }
        }

        .profile-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--primary-gold);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .profile-media {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #111;
        }

        .profile-content {
            padding: 14px;
        }

        .profile-name {
            font-size: 1.1rem;
            color: var(--deep-red);
            font-weight: bold;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-detail {
            font-size: 13px;
            color: #444;
            margin-bottom: 4px;
        }

        .card-actions {
            padding: 12px;
            border-top: 1px solid #eee;
            background: #FAFAFA;
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            text-decoration: none;
            color: white;
            background: var(--deep-red);
            display: block;
            border: none;
            cursor: pointer;
        }

        /* FOOTER PROFESSIONNEL */
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-top: 4px solid var(--primary-gold);
        }

        footer a {
            color: var(--primary-gold);
            text-decoration: underline;
            font-weight: bold;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <a href="index.html">
                <img src="https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png" alt="Logo Love Bébé" class="header-logo">
            </a>
            <div class="brand-text">
                <span class="header-title">LOVE BÉBÉ</span>
                <span class="header-subtitle">PLATEFORME ÉLITE DES RENCONTRES</span>
            </div>
        </div>

        <div class="nav-actions">
            <a href="profil.html" id="profile-nav-btn" class="nav-btn nav-btn-blue">
                <span class="btn-icon">👤</span> <span id="profile-nav-text">Mon Profil</span>
            </a>
            <button class="nav-btn" id="auth-btn">
                <span class="btn-icon">🔐</span> <span id="auth-btn-text">Connexion</span>
            </button>
        </div>
    </header>

    <div class="container">
        
        <div class="hero-banner">
            <h1>L'Amour Véritable Vous Attend ❤️</h1>
            <p>Découvrez en toute sécurité les profils de nos membres.</p>
        </div>

        <!-- FILTRES DE RECHERCHE -->
        <div id="filterSection" class="filter-section">
            <input type="text" id="searchInput" class="filter-input" placeholder="🔍 Rechercher par nom, ville ou pays...">
            <select id="genderFilter" class="filter-select">
                <option value="">Tous les genres</option>
                <option value="Masculin">Hommes uniquement</option>
                <option value="Féminin">Femmes uniquement</option>
            </select>
            <select id="ageFilter" class="filter-select">
                <option value="">Toutes les tranches d'âge</option>
                <option value="18-25">18 - 25 ans</option>
                <option value="25-30">25 - 30 ans</option>
                <option value="30-35">30 - 35 ans</option>
                <option value="35-40">35 - 40 ans</option>
                <option value="40-45">40 - 45 ans</option>
                <option value="45+">45 ans et plus</option>
            </select>
        </div>

        <!-- CONTENEUR DES PROFILS -->
        <div id="profilesContainer" class="profiles-grid">
            <p style="text-align:center; grid-column: 1/-1; font-weight:bold; color:#0D47A1; padding:30px;">Chargement des profils...</p>
        </div>

    </div>

    <!-- FOOTER AVEC LIEN CORRIGÉ VERS LA POLITIQUE DE CONFIDENTIALITÉ -->
    <footer>
        <p>&copy; 2026 Love Bébé - Tous droits réservés.</p>
        <p style="margin-top: 8px;">
            <a href="politique-confidentialite.html">Politique de Confidentialité</a>
        </p>
    </footer>

    <script type="module">
        import { auth, database } from "./love-bebe-service.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        let allProfilesList = [];
        let currentUserId = null;

        const authBtn = document.getElementById('auth-btn');
        const authBtnText = document.getElementById('auth-btn-text');
        const profileNavBtn = document.getElementById('profile-nav-btn');
        const profileNavText = document.getElementById('profile-nav-text');

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "connexion.html";
                return;
            }

            currentUserId = user.uid;

            authBtnText.textContent = "Déconnexion";
            authBtn.querySelector('.btn-icon').textContent = "🚪";
            authBtn.onclick = async () => {
                await signOut(auth);
                window.location.href = "connexion.html";
            };

            try {
                const userSnapshot = await get(child(ref(database), `users/${user.uid}`));
                if (userSnapshot.exists()) {
                    const userData = userSnapshot.val();
                    if (userData.isAdmin || userData.role === "admin" || userData.role === "super admin") {
                        profileNavText.textContent = "Admin";
                        profileNavBtn.querySelector('.btn-icon').textContent = "⚙️";
                        profileNavBtn.href = "admin.html";
                    } else {
                        profileNavText.textContent = "Mon Profil";
                        profileNavBtn.querySelector('.btn-icon').textContent = "👤";
                        profileNavBtn.href = "profil.html";
                    }
                }
            } catch (err) {
                console.error("Erreur rôle :", err);
            }

            fetchProfiles();
        });

        async function fetchProfiles() {
            try {
                const [menSnap, womenSnap, generalSnap] = await Promise.all([
                    get(ref(database, 'profil_hommes')),
                    get(ref(database, 'profil_femmes')),
                    get(ref(database, 'users'))
                ]);

                const profilesMap = {};
                [menSnap, womenSnap, generalSnap].forEach(snap => {
                    if (snap.exists()) {
                        const val = snap.val();
                        Object.keys(val).forEach(uid => {
                            const user = val[uid];
                            if (uid !== currentUserId && !user.isAdmin && user.role !== "admin" && user.role !== "super admin") {
                                profilesMap[uid] = user;
                            }
                        });
                    }
                });
                allProfilesList = Object.values(profilesMap);
                renderProfiles(allProfilesList);

            } catch (error) {
                console.error("Erreur de chargement des profils :", error);
            }
        }

        function renderProfiles(list) {
            const container = document.getElementById('profilesContainer');
            container.innerHTML = "";

            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const genderVal = document.getElementById('genderFilter').value;
            const ageVal = document.getElementById('ageFilter').value;
            let count = 0;

            list.forEach(user => {
                const name = user.fullName || 'Célibataire Love Bébé';
                const city = user.city || '';
                const country = user.country || '';
                const gender = user.gender || '';
                const age = user.age ? `${user.age} ans` : 'Âge non spécifié';

                if (searchVal && !name.toLowerCase().includes(searchVal) && !city.toLowerCase().includes(searchVal) && !country.toLowerCase().includes(searchVal)) return;
                if (genderVal && gender !== genderVal) return;

                if (ageVal) {
                    const userAge = parseInt(user.age);
                    if (isNaN(userAge)) return;
                    if (ageVal === "18-25" && (userAge < 18 || userAge > 25)) return;
                    if (ageVal === "25-30" && (userAge < 25 || userAge > 30)) return;
                    if (ageVal === "30-35" && (userAge < 30 || userAge > 35)) return;
                    if (ageVal === "35-40" && (userAge < 35 || userAge > 40)) return;
                    if (ageVal === "40-45" && (userAge < 40 || userAge > 45)) return;
                    if (ageVal === "45+" && userAge < 45) return;
                }

                count++;
                const mediaUrl = user.capturedPhotos?.[0] || user.profileMediaUrl || 'https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png';
                const targetUid = user.uid || '';

                const card = document.createElement('div');
                card.className = 'profile-card';
                card.innerHTML = `
                    <img src="${mediaUrl}" alt="${name}" class="profile-media">
                    <div class="profile-content">
                        <div class="profile-name">${name}</div>
                        <div class="profile-detail">📍 ${city ? city + ', ' : ''}${country || 'Pays non précisé'}</div>
                        <div class="profile-detail">🎂 ${age}</div>
                        <div class="profile-detail">💍 ${user.maritalStatus || 'Relation sérieuse'}</div>
                    </div>
                    <div class="card-actions">
                        <a href="messagerie.html?id=${targetUid}" class="action-btn">💬 Discuter & Appeler</a>
                    </div>
                `;
                container.appendChild(card);
            });

            if (count === 0) {
                container.innerHTML = "<p style='text-align:center; grid-column: 1/-1; font-weight:bold; color:#D32F2F; padding:30px;'>Aucun profil trouvé.</p>";
            }
        }

        document.getElementById('searchInput').addEventListener('input', () => renderProfiles(allProfilesList));
        document.getElementById('genderFilter').addEventListener('change', () => renderProfiles(allProfilesList));
        document.getElementById('ageFilter').addEventListener('change', () => renderProfiles(allProfilesList));
    </script>
</body>
</html>
