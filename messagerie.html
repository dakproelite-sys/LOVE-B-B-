<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Love Bébé - Messagerie WhatsApp</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFD700">

    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-gold: #FFA500;
            --deep-red: #D32F2F;
            --dark-red: #B71C1C;
            --accent-blue: #0D47A1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { background: #e5ddd5; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        .app-container { display: flex; flex: 1; height: 100%; overflow: hidden; position: relative; width: 100%; }

        /* SIDEBAR CONTACTS */
        .contacts-sidebar { width: 330px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; height: 100%; z-index: 5; flex-shrink: 0; }
        .sidebar-header { background: #f0f2f5; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ddd; flex-shrink: 0; }
        .sidebar-header h3 { color: var(--deep-red); font-size: 15px; }

        .search-box { padding: 8px 12px; background: #fff; border-bottom: 1px solid #eee; flex-shrink: 0; }
        .search-input { width: 100%; padding: 7px 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 13px; background: #f0f2f5; }
        .contacts-list { flex: 1; overflow-y: auto; }
        .contact-card {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px;
            cursor: pointer; border-bottom: 1px solid #f2f2f2; transition: 0.2s;
        }
        .contact-card:hover, .contact-card.active { background: #f5f6f6; }
        .contact-avatar-wrapper { position: relative; flex-shrink: 0; }
        .contact-card img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-gold); display: block; }
        
        /* Indicateur de présence liste */
        .status-dot {
            position: absolute; bottom: 2px; right: 2px; width: 11px; height: 11px;
            border-radius: 50%; border: 2px solid #fff; background: #ccc;
        }
        .status-dot.online { background: #28a745; }

        .contact-card-info { min-width: 0; flex: 1; }
        .contact-card-info h4 { font-size: 14px; color: #111; margin-bottom: 2px; }
        .contact-card-info p { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }

        /* ZONE CHAT PRINCIPALE */
        .chat-main { flex: 1; display: flex; flex-direction: column; background: #e5ddd5; height: 100%; position: relative; min-width: 0; }
        
        /* HEADER DU CHAT ACTIF */
        .chat-header {
            background: #f0f2f5; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #ddd; height: 60px; z-index: 10; flex-shrink: 0;
        }
        .chat-header-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .back-to-contacts { display: none; background: none; border: none; font-size: 18px; color: var(--deep-red); cursor: pointer; font-weight: bold; flex-shrink: 0; padding: 4px 8px; }
        .target-avatar-wrapper { position: relative; flex-shrink: 0; }
        .target-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-gold); display: block; }
        .target-meta { min-width: 0; }
        .target-meta h4 { font-size: 14px; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .target-meta p { font-size: 11px; color: #666; font-weight: 500; }
        .target-meta p.is-online { color: #28a745; font-weight: 600; }

        .call-buttons { display: flex; gap: 5px; flex-shrink: 0; }
        .btn-call-head {
            background: #2E7D32; color: white; border: none; padding: 6px 10px;
            border-radius: 15px; font-weight: bold; font-size: 11px; cursor: pointer;
            display: flex; align-items: center; gap: 3px; white-space: nowrap;
        }
        .btn-video-head { background: var(--deep-red); }

        /* MESSAGES FLUX */
        .chat-messages { flex: 1; padding: 12px 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
        .message-bubble {
            max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 14px;
            line-height: 1.4; word-break: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }
        .message-sent { align-self: flex-end; background: #dcf8c6; color: #111; border-bottom-right-radius: 2px; }
        .message-received { align-self: flex-start; background: #ffffff; color: #222; border-bottom-left-radius: 2px; }

        .msg-media { max-width: 100%; border-radius: 8px; margin-top: 5px; max-height: 220px; object-fit: cover; display: block; }
        .msg-time { font-size: 10px; opacity: 0.75; text-align: right; margin-top: 4px; }

        /* STICKERS / SIGNES D'AMOUR BAR */
        .stickers-bar {
            background: #fdfdfd; padding: 6px 12px; display: flex; gap: 8px; border-top: 1px solid #e0e0e0;
            overflow-x: auto; flex-shrink: 0; white-space: nowrap; -webkit-overflow-scrolling: touch;
        }
        .sticker-btn { background: none; border: none; font-size: 20px; cursor: pointer; transition: transform 0.1s; padding: 2px; flex-shrink: 0; }
        .sticker-btn:hover { transform: scale(1.2); }

        /* INPUT BARRE */
        .chat-input-area {
            padding: 8px 10px; background: #f0f0f0; border-top: 1px solid #ddd;
            display: flex; gap: 6px; align-items: center; flex-shrink: 0; width: 100%;
        }
        .chat-input { flex: 1; padding: 9px 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 14px; background: #fff; min-width: 0; }
        .btn-action {
            border: none; border-radius: 50%; font-weight: bold; cursor: pointer;
            color: white; display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; font-size: 14px; flex-shrink: 0;
        }
        .btn-send { background: var(--deep-red); }
        .btn-attach { background: #555; }
        .btn-vocal { background: var(--accent-blue); }

        /* ÉCRAN D'ACCUEIL CHAT VIDE */
        .empty-chat-placeholder {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #666; text-align: center; padding: 20px; background: #f8f9fa;
        }

        /* OVERLAY APPEL HD STYLE WHATSAPP / MESSENGER */
        #callOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            background: rgba(15, 23, 42, 0.96); z-index: 2000; display: flex;
            flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 20px; color: white;
        }
        .call-profile-view { text-align: center; margin-top: 40px; z-index: 2; display: flex; flex-direction: column; align-items: center; }
        .call-avatar-big {
            width: 130px; height: 130px; border-radius: 50%; object-fit: cover;
            border: 4px solid var(--primary-gold); box-shadow: 0 0 30px rgba(255, 215, 0, 0.5); margin-bottom: 20px;
        }
        .video-streams { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; background: #000; }
        #localVideo {
            position: absolute; top: 20px; right: 20px; width: 100px; height: 140px;
            border-radius: 12px; border: 2px solid #fff; object-fit: cover; z-index: 3; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .call-controls-bottom { z-index: 4; display: flex; gap: 30px; margin-bottom: 30px; align-items: center; }
        .btn-call-act {
            width: 65px; height: 65px; border-radius: 50%; border: none; font-size: 24px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.1s;
        }
        .btn-call-act:active { transform: scale(0.95); }
        .btn-accept { background: #2E7D32; animation: pulseCall 1.5s infinite; }
        .btn-reject { background: var(--deep-red); }

        @keyframes pulseCall {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(46, 125, 50, 0.6); }
            70% { transform: scale(1.08); box-shadow: 0 0 0 15px rgba(46, 125, 50, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(46, 125, 50, 0); }
        }

        .hidden { display: none !important; }

        @media(max-width: 768px) {
            .app-container { position: relative; width: 100vw; overflow: hidden; }
            .contacts-sidebar { width: 100%; position: absolute; left: 0; top: 0; height: 100%; transition: transform 0.25s ease; }
            .contacts-sidebar.hidden-mobile { transform: translateX(-100%); }
            .chat-main { width: 100%; position: absolute; left: 0; top: 0; height: 100%; display: none; }
            .chat-main.active-mobile { display: flex !important; }
            .back-to-contacts { display: inline-block !important; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- SIDEBAR CONTACTS -->
        <div class="contacts-sidebar" id="sidebarSection">
            <div class="sidebar-header">
                <h3 id="uiTitle">💬 Love Bébé</h3>
                <a href="profil.html" id="uiProfileLink" style="text-decoration:none; color:var(--deep-red); font-size:13px; font-weight:bold;">Mon Profil 👤</a>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Rechercher un nom...">
            </div>
            <div class="contacts-list" id="contactsList">
                <p id="uiLoading" style="padding:20px; color:#777; text-align:center;">Chargement des profils...</p>
            </div>
        </div>

        <!-- FENÊTRE CHAT PRINCIPALE -->
        <div class="chat-main" id="chatMainSection">
            <div id="activeChatHeader" class="chat-header hidden">
                <div class="chat-header-left">
                    <button class="back-to-contacts" id="backBtn">←</button>
                    <div class="target-avatar-wrapper">
                        <img id="headerAvatar" src="https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png" class="target-avatar" alt="Profil">
                        <span id="headerStatusDot" class="status-dot"></span>
                    </div>
                    <div class="target-meta">
                        <h4 id="targetName">Sélectionnez un contact</h4>
                        <p id="uiOnline">Hors ligne</p>
                    </div>
                </div>
                <div class="call-buttons">
                    <button id="startAudioCallBtn" class="btn-call-head" title="Appel Audio">📞 Audio</button>
                    <button id="startVideoCallBtn" class="btn-call-head btn-video-head" title="Appel Vidéo">🎥 Vidéo</button>
                </div>
            </div>

            <!-- Placeholder -->
            <div id="emptyPlaceholder" class="empty-chat-placeholder">
                <h2>Messagerie Love Bébé</h2>
                <p style="margin-top: 8px; color: #666; font-size: 14px;">Sélectionnez une personne dans la liste pour discuter et lancer un appel.</p>
            </div>

            <!-- Messages flux -->
            <div id="messagesArea" class="chat-messages hidden"></div>

            <!-- Stickers d'Amour -->
            <div id="stickersBar" class="stickers-bar hidden">
                <button class="sticker-btn" onclick="sendSticker('😍')">😍</button>
                <button class="sticker-btn" onclick="sendSticker('💖')">💖</button>
                <button class="sticker-btn" onclick="sendSticker('😘')">😘</button>
                <button class="sticker-btn" onclick="sendSticker('🌹')">🌹</button>
                <button class="sticker-btn" onclick="sendSticker('💍')">💍</button>
                <button class="sticker-btn" onclick="sendSticker('💋')">💋</button>
                <button class="sticker-btn" onclick="sendSticker('🔥')">🔥</button>
                <button class="sticker-btn" onclick="sendSticker('🥰')">🥰</button>
                <button class="sticker-btn" onclick="sendSticker('💕')">💕</button>
                <button class="sticker-btn" onclick="sendSticker('🍾')">🍾</button>
            </div>

            <!-- Barre de saisie -->
            <div id="chatInputArea" class="chat-input-area hidden">
                <input type="file" id="mediaFileInput" accept="image/*,video/*" style="display: none;">
                <button id="attachBtn" class="btn-action btn-attach" title="Envoyer une photo/vidéo">📎</button>
                <input type="text" id="textInput" class="chat-input" placeholder="Écrivez votre message...">
                <button id="vocalBtn" class="btn-action btn-vocal" title="Enregistrer un vocal">🎙️</button>
                <button id="sendBtn" class="btn-action btn-send" title="Envoyer">➤</button>
            </div>
        </div>
    </div>

    <!-- OVERLAY APPEL HD -->
    <div id="callOverlay" class="hidden">
        <audio id="remoteAudio" autoplay playsinline></audio>
        <video id="remoteVideo" class="video-streams hidden" autoplay playsinline></video>
        <video id="localVideo" class="hidden" autoplay playsinline muted></video>

        <div id="callProfileBox" class="call-profile-view">
            <img id="callAvatar" src="https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png" class="call-avatar-big" alt="Profil">
            <h2 id="callTargetName" style="margin-bottom:8px;">Correspondant</h2>
            <p id="callStatusText" style="color:var(--primary-gold); font-size: 15px; font-weight: 600;">Appel en cours...</p>
        </div>

        <div class="call-controls-bottom">
            <button id="acceptCallBtn" class="btn-call-act btn-accept hidden" title="Décrocher">📞</button>
            <button id="endCallBtn" class="btn-call-act btn-reject" title="Raccrocher">❌</button>
        </div>
    </div>

    <script type="module">
        import { auth, database } from "./love-bebe-service.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { ref, onValue, push, set, get, remove, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        let currentUser = null;
        let currentUserGender = "";
        let activeTarget = null;
        let allContacts = [];
        let peerConnection = null;
        let localStream = null;
        let currentCallRef = null;
        let isVideoCall = true;
        let cloudinaryConfig = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let ringtoneInterval = null;
        let statusUnsubscribe = null;

        // GESTION DE LA PRÉSENCE EN LIGNE (ONLINE / OFFLINE)
        function initPresence(user) {
            const userStatusRef = ref(database, `status/${user.uid}`);
            const connectedRef = ref(database, ".info/connected");

            onValue(connectedRef, (snap) => {
                if (snap.val() === true) {
                    const offlineData = {
                        state: "offline",
                        lastChanged: serverTimestamp()
                    };
                    const onlineData = {
                        state: "online",
                        lastChanged: serverTimestamp()
                    };

                    onDisconnect(userStatusRef).set(offlineData).then(() => {
                        set(userStatusRef, onlineData);
                    });
                }
            });
        }

        // SYSTÈME DE SONNERIE D'AMOUR (WEB AUDIO API)
        function startLoveRingtone() {
            stopLoveRingtone();
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                function playTone() {
                    if (!ringtoneInterval) return;
                    if (audioCtx.state === 'suspended') audioCtx.resume();

                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // Do (C5)
                    osc.frequency.setValueAtTime(659.25, now + 0.15); // Mi (E5)
                    osc.frequency.setValueAtTime(783.99, now + 0.30); // Sol (G5)

                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now);
                    osc.stop(now + 0.5);
                }

                playTone();
                ringtoneInterval = setInterval(playTone, 1400);
            } catch (e) {
                console.log("Erreur audio ringtone :", e);
            }
        }

        function stopLoveRingtone() {
            if (ringtoneInterval) {
                clearInterval(ringtoneInterval);
                ringtoneInterval = null;
            }
        }

        const rtcConfig = {
            iceServers: [
                { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }
            ]
        };

        const TWENTY_DAYS_MS = 20 * 24 * 60 * 60 * 1000;

        const callOverlay = document.getElementById('callOverlay');
        const callProfileBox = document.getElementById('callProfileBox');
        const remoteVideo = document.getElementById('remoteVideo');
        const remoteAudio = document.getElementById('remoteAudio');
        const localVideo = document.getElementById('localVideo');
        const acceptCallBtn = document.getElementById('acceptCallBtn');
        const endCallBtn = document.getElementById('endCallBtn');
        const contactsList = document.getElementById('contactsList');
        const searchInput = document.getElementById('searchInput');
        const messagesArea = document.getElementById('messagesArea');
        const textInput = document.getElementById('textInput');
        const mediaFileInput = document.getElementById('mediaFileInput');
        
        const sidebarSection = document.getElementById('sidebarSection');
        const chatMainSection = document.getElementById('chatMainSection');
        const activeChatHeader = document.getElementById('activeChatHeader');
        const emptyPlaceholder = document.getElementById('emptyPlaceholder');
        const chatInputArea = document.getElementById('chatInputArea');
        const stickersBar = document.getElementById('stickersBar');
        const backBtn = document.getElementById('backBtn');

        onAuthStateChanged(auth, async (user) => {
            if (!user) return window.location.href = "connexion.html";
            currentUser = user;

            initPresence(user);

            try {
                const configSnap = await get(ref(database, "config/cloudinary"));
                if (configSnap.exists()) cloudinaryConfig = configSnap.val();

                const userSnap = await get(ref(database, `users/${user.uid}`));
                if (userSnap.exists()) {
                    currentUserGender = userSnap.val().gender || "Masculin";
                }

                loadContactsList();
                listenIncomingCalls();

                const urlParams = new URLSearchParams(window.location.search);
                const targetUid = urlParams.get('id');
                if (targetUid) {
                    const tSnap = await get(ref(database, `users/${targetUid}`));
                    if (tSnap.exists()) selectContact(tSnap.val());
                }
            } catch (err) {
                console.error("Erreur d'initialisation :", err);
            }
        });

        async function loadContactsList() {
            const targetCategory = currentUserGender === "Masculin" ? "profil_femmes" : "profil_hommes";
            contactsList.replaceChildren();

            try {
                const snap = await get(ref(database, targetCategory));
                if (snap.exists()) {
                    allContacts = Object.values(snap.val()).filter(u => u.uid !== currentUser.uid);
                    renderContacts(allContacts);
                    
                    // Suivre l'état en ligne de tous les contacts de la liste
                    allContacts.forEach(u => {
                        onValue(ref(database, `status/${u.uid}`), (sSnap) => {
                            const val = sSnap.val();
                            const dotEl = document.getElementById(`dot_${u.uid}`);
                            if (dotEl && val && val.state === 'online') {
                                dotEl.classList.add('online');
                            } else if (dotEl) {
                                dotEl.classList.remove('online');
                            }
                        });
                    });
                } else {
                    contactsList.innerHTML = `<p style="padding:15px; color:#777; text-align:center;">Aucun membre disponible.</p>`;
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderContacts(list) {
            contactsList.replaceChildren();
            if (list.length === 0) {
                contactsList.innerHTML = `<p style="padding:15px; color:#777; text-align:center;">Aucun contact trouvé.</p>`;
                return;
            }

            list.forEach(u => {
                const card = document.createElement("div");
                card.className = "contact-card";
                const photo = u.profileMediaUrl || 'https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png';
                
                card.innerHTML = `
                    <div class="contact-avatar-wrapper">
                        <img src="${photo}">
                        <span class="status-dot" id="dot_${u.uid}"></span>
                    </div>
                    <div class="contact-card-info">
                        <h4>${u.fullName || 'Célibataire'}</h4>
                        <p>${u.city || ''} ${u.profession ? '• ' + u.profession : ''}</p>
                    </div>
                `;
                card.onclick = () => selectContact(u);
                contactsList.appendChild(card);
            });
        }

        searchInput.oninput = (e) => {
            const term = e.target.value.toLowerCase().trim();
            const filtered = allContacts.filter(c => (c.fullName || "").toLowerCase().includes(term));
            renderContacts(filtered);
        };

        function selectContact(targetUser) {
            activeTarget = targetUser;
            const photo = targetUser.profileMediaUrl || 'https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png';

            document.getElementById('targetName').textContent = targetUser.fullName;
            document.getElementById('headerAvatar').src = photo;
            document.getElementById('callTargetName').textContent = targetUser.fullName;
            document.getElementById('callAvatar').src = photo;

            emptyPlaceholder.classList.add('hidden');
            activeChatHeader.classList.remove('hidden');
            messagesArea.classList.remove('hidden');
            stickersBar.classList.remove('hidden');
            chatInputArea.classList.remove('hidden');

            if (window.innerWidth <= 768) {
                sidebarSection.classList.add('hidden-mobile');
                chatMainSection.classList.add('active-mobile');
            }

            // Écouter le statut en direct du contact actif
            if (statusUnsubscribe) statusUnsubscribe();
            const statusRef = ref(database, `status/${targetUser.uid}`);
            statusUnsubscribe = onValue(statusRef, (snap) => {
                const val = snap.val();
                const uiOnline = document.getElementById('uiOnline');
                const headerDot = document.getElementById('headerStatusDot');

                if (val && val.state === 'online') {
                    uiOnline.textContent = "En ligne";
                    uiOnline.className = "is-online";
                    headerDot.classList.add('online');
                } else {
                    headerDot.classList.remove('online');
                    if (val && val.lastChanged) {
                        const date = new Date(val.lastChanged);
                        const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        const dayStr = date.toLocaleDateString([], { day: '2-digit', month: '2-digit' });
                        uiOnline.textContent = `Dernier vu le ${dayStr} à ${timeStr}`;
                    } else {
                        uiOnline.textContent = "Hors ligne";
                    }
                    uiOnline.className = "";
                }
            });

            listenToChat();
        }

        backBtn.onclick = () => {
            if (window.innerWidth <= 768) {
                sidebarSection.classList.remove('hidden-mobile');
                chatMainSection.classList.remove('active-mobile');
            }
        };

        function getChatRoomId(uid1, uid2) {
            return uid1 < uid2 ? `${uid1}_${uid2}` : `${uid2}_${uid1}`;
        }

        function listenToChat() {
            if (!activeTarget) return;
            const chatRoomId = getChatRoomId(currentUser.uid, activeTarget.uid);
            const chatRef = ref(database, `chats/${chatRoomId}`);

            onValue(chatRef, async (snapshot) => {
                messagesArea.replaceChildren();
                if (!snapshot.exists()) {
                    messagesArea.innerHTML = `<p style='text-align:center; color:#888; margin:auto;'>Démarrez la conversation ! ❤️</p>`;
                    return;
                }

                const data = snapshot.val();
                const now = Date.now();

                for (const key of Object.keys(data)) {
                    const msg = data[key];

                    if (msg.timestamp && (now - msg.timestamp > TWENTY_DAYS_MS)) {
                        remove(ref(database, `chats/${chatRoomId}/${key}`));
                        continue;
                    }

                    const isMe = msg.senderUid === currentUser.uid;
                    const bubble = document.createElement('div');
                    bubble.className = `message-bubble ${isMe ? 'message-sent' : 'message-received'}`;

                    let contentHtml = "";
                    if (msg.type === 'text') contentHtml = `<p>${msg.text}</p>`;
                    else if (msg.type === 'media') contentHtml = `<img src="${msg.mediaUrl}" class="msg-media">`;
                    else if (msg.type === 'audio') contentHtml = `<audio src="${msg.mediaUrl}" controls style="max-width:200px;"></audio>`;

                    const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
                    contentHtml += `<div class="msg-time">${timeStr}</div>`;

                    bubble.innerHTML = contentHtml;
                    messagesArea.appendChild(bubble);
                }
                messagesArea.scrollTop = messagesArea.scrollHeight;
            });
        }

        document.getElementById('sendBtn').onclick = async () => {
            const text = textInput.value.trim();
            if (!text || !activeTarget) return;
            const chatRoomId = getChatRoomId(currentUser.uid, activeTarget.uid);

            await push(ref(database, `chats/${chatRoomId}`), {
                senderUid: currentUser.uid,
                text: text,
                type: 'text',
                timestamp: Date.now()
            });
            textInput.value = "";
        };

        textInput.onkeypress = (e) => { if (e.key === 'Enter') document.getElementById('sendBtn').click(); };

        window.sendSticker = async (stickerEmoji) => {
            if (!activeTarget) return;
            const chatRoomId = getChatRoomId(currentUser.uid, activeTarget.uid);
            await push(ref(database, `chats/${chatRoomId}`), {
                senderUid: currentUser.uid,
                text: stickerEmoji,
                type: 'text',
                timestamp: Date.now()
            });
        };

        document.getElementById('attachBtn').onclick = () => mediaFileInput.click();
        mediaFileInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file || !cloudinaryConfig || !activeTarget) return;

            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", cloudinaryConfig.upload_preset);

            const resourceType = file.type.startsWith("video") ? "video" : "image";
            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloud_name}/${resourceType}/upload`, {
                    method: "POST", body: formData
                });
                const data = await res.json();

                if (data.secure_url) {
                    const chatRoomId = getChatRoomId(currentUser.uid, activeTarget.uid);
                    await push(ref(database, `chats/${chatRoomId}`), {
                        senderUid: currentUser.uid,
                        mediaUrl: data.secure_url,
                        type: 'media',
                        timestamp: Date.now()
                    });
                }
            } catch (err) {
                console.error("Erreur d'envoi multimédia :", err);
            }
        };

        document.getElementById('vocalBtn').onclick = async () => {
            if (!activeTarget || !cloudinaryConfig) return;

            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                document.getElementById('vocalBtn').textContent = "🎙️";
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioChunks = [];
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const formData = new FormData();
                        formData.append("file", audioBlob, "vocal.webm");
                        formData.append("upload_preset", cloudinaryConfig.upload_preset);

                        const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloud_name}/video/upload`, {
                            method: "POST", body: formData
                        });
                        const data = await res.json();
                        if (data.secure_url) {
                            const chatRoomId = getChatRoomId(currentUser.uid, activeTarget.uid);
                            await push(ref(database, `chats/${chatRoomId}`), {
                                senderUid: currentUser.uid,
                                mediaUrl: data.secure_url,
                                type: 'audio',
                                timestamp: Date.now()
                            });
                        }
                    };

                    mediaRecorder.start();
                    document.getElementById('vocalBtn').textContent = "🛑";
                } catch (e) {
                    alert("Accès au micro refusé.");
                }
            }
        };

        // GESTION DES APPELS WEBRTC HD & SONNERIE D'AMOUR
        document.getElementById('startVideoCallBtn').onclick = () => initiateCall(true);
        document.getElementById('startAudioCallBtn').onclick = () => initiateCall(false);

        async function initiateCall(videoEnabled) {
            if (!activeTarget) return alert("Sélectionnez un contact à appeler.");
            isVideoCall = videoEnabled;

            callOverlay.classList.remove('hidden');
            acceptCallBtn.classList.add('hidden');
            document.getElementById('callStatusText').textContent = isVideoCall ? "Appel vidéo en cours..." : "Sonnerie (Appel audio)...";

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: isVideoCall, audio: true });
                if (isVideoCall) {
                    localVideo.srcObject = localStream;
                    localVideo.classList.remove('hidden');
                }
            } catch (err) {
                alert("Impossible d'accéder à la caméra ou au micro.");
                endCall();
                return;
            }

            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                const remoteStream = event.streams[0];
                if (isVideoCall) {
                    remoteVideo.srcObject = remoteStream;
                    callProfileBox.classList.add('hidden');
                    remoteVideo.classList.remove('hidden');
                } else {
                    remoteAudio.srcObject = remoteStream;
                    remoteAudio.play().catch(e => console.log("Lecture audio :", e));
                    document.getElementById('callStatusText').textContent = "En communication audio (Main libre)";
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && activeTarget) {
                    push(ref(database, `calls/${activeTarget.uid}/callerCandidates`), event.candidate.toJSON());
                }
            };

            const callRef = ref(database, `calls/${activeTarget.uid}`);
            currentCallRef = callRef;

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            await set(callRef, {
                callerUid: currentUser.uid,
                type: isVideoCall ? 'video' : 'audio',
                offer: { type: offer.type, sdp: offer.sdp }
            });

            onValue(callRef, async (snap) => {
                if (snap.exists()) {
                    const data = snap.val();
                    if (data.answer && peerConnection && !peerConnection.currentRemoteDescription) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                        document.getElementById('callStatusText').textContent = isVideoCall ? "En communication vidéo" : "En communication audio (Main libre)";
                    }
                } else {
                    if (peerConnection) endCall();
                }
            });

            onValue(ref(database, `calls/${activeTarget.uid}/receiverCandidates`), (snap) => {
                if (snap.exists() && peerConnection) {
                    snap.forEach((childSnap) => {
                        peerConnection.addIceCandidate(new RTCIceCandidate(childSnap.val())).catch(() => {});
                    });
                }
            });
        }

        function listenIncomingCalls() {
            onValue(ref(database, `calls/${currentUser.uid}`), async (snapshot) => {
                if (!snapshot.exists()) {
                    stopLoveRingtone();
                    if (peerConnection) endCall();
                    return;
                }

                const callData = snapshot.val();
                if (!callData.offer || peerConnection) return;

                currentCallRef = ref(database, `calls/${currentUser.uid}`);
                isVideoCall = callData.type === 'video';

                callOverlay.classList.remove('hidden');
                acceptCallBtn.classList.remove('hidden');
                document.getElementById('callStatusText').textContent = isVideoCall ? "Appel vidéo entrant... 💖" : "Appel audio entrant... 💖";

                startLoveRingtone();

                try {
                    const callerSnap = await get(ref(database, `users/${callData.callerUid}`));
                    if (callerSnap.exists()) {
                        const cData = callerSnap.val();
                        document.getElementById('callTargetName').textContent = cData.fullName || "Correspondant";
                        if (cData.profileMediaUrl) document.getElementById('callAvatar').src = cData.profileMediaUrl;
                    }
                } catch(e) {}

                acceptCallBtn.onclick = () => {
                    stopLoveRingtone();
                    answerCall(callData);
                };
            });
        }

        async function answerCall(callData) {
            stopLoveRingtone();
            acceptCallBtn.classList.add('hidden');
            document.getElementById('callStatusText').textContent = "Connexion sécurisée en cours...";

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: isVideoCall, audio: true });
                if (isVideoCall) {
                    localVideo.srcObject = localStream;
                    localVideo.classList.remove('hidden');
                }
            } catch (err) {
                alert("Erreur d'accès aux périphériques (caméra/micro).");
                endCall();
                return;
            }

            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                const remoteStream = event.streams[0];
                if (isVideoCall) {
                    remoteVideo.srcObject = remoteStream;
                    callProfileBox.classList.add('hidden');
                    remoteVideo.classList.remove('hidden');
                } else {
                    remoteAudio.srcObject = remoteStream;
                    remoteAudio.play().catch(e => console.log("Lecture audio :", e));
                    document.getElementById('callStatusText').textContent = "En communication audio (Main libre)";
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    push(ref(database, `calls/${callData.callerUid}/receiverCandidates`), event.candidate.toJSON());
                }
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            await set(currentCallRef, {
                ...callData,
                answer: { type: answer.type, sdp: answer.sdp }
            });

            document.getElementById('callStatusText').textContent = isVideoCall ? "En communication vidéo" : "En communication audio (Main libre)";

            onValue(ref(database, `calls/${currentUser.uid}/callerCandidates`), (snap) => {
                if (snap.exists() && peerConnection) {
                    snap.forEach((childSnap) => {
                        peerConnection.addIceCandidate(new RTCIceCandidate(childSnap.val())).catch(() => {});
                    });
                }
            });
        }

        endCallBtn.onclick = () => endCall();

        function endCall() {
            stopLoveRingtone();
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if (currentCallRef) {
                remove(currentCallRef).catch(() => {});
                currentCallRef = null;
            }

            callOverlay.classList.add('hidden');
            remoteVideo.classList.add('hidden');
            remoteAudio.srcObject = null;
            localVideo.classList.add('hidden');
            callProfileBox.classList.remove('hidden');
            acceptCallBtn.classList.add('hidden');
            document.getElementById('callStatusText').textContent = "Appel en cours...";
        }
    </script>
</body>
</html>
