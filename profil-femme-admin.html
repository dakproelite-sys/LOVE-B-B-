<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestion Profils Femmes</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFD700">
    <style>
        :root { --primary-gold: #FFD700; --dark-gold: #FFA500; --deep-red: #D32F2F; --dark-red: #B71C1C; --accent-blue: #0D47A1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, var(--primary-gold) 0%, var(--dark-gold) 100%); min-height: 100vh; color: #222; padding-bottom: 40px; }
        header { background: #ffffff; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--deep-red); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .header-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .header-logo { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--primary-gold); object-fit: cover; }
        .header-title { font-size: 1.3rem; font-weight: bold; color: var(--deep-red); text-transform: uppercase; }
        .nav-btn { background: linear-gradient(135deg, var(--deep-red), var(--dark-red)); color: white; padding: 8px 16px; border-radius: 20px; font-weight: bold; text-decoration: none; font-size: 13px; border: none; cursor: pointer; }
        .container { max-width: 1200px; margin: 25px auto; padding: 0 20px; }
        .hero-banner { background: #ffffff; border-radius: 15px; padding: 25px; text-align: center; border: 3px solid var(--primary-gold); box-shadow: 0 8px 25px rgba(0,0,0,0.15); margin-bottom: 30px; }
        .hero-banner h1 { color: var(--deep-red); font-size: 1.6rem; margin-bottom: 8px; }
        .profiles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .profile-card { background: #fff; border-radius: 15px; overflow: hidden; border: 3px solid var(--primary-gold); box-shadow: 0 4px 15px rgba(0,0,0,0.15); display: flex; flex-direction: column; justify-content: space-between; }
        .profile-media { width: 100%; height: 220px; object-fit: cover; background: #000; }
        .profile-content { padding: 15px; }
        .profile-name { font-size: 1.2rem; color: var(--deep-red); font-weight: bold; margin-bottom: 5px; }
        .profile-detail { font-size: 13px; color: #444; margin-bottom: 4px; }
        .btn-delete { background: var(--deep-red); color: white; border: none; padding: 8px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 6px; margin-top: 10px; }
    </style>
</head>
<body>
    <header>
        <a href="admin.html" class="header-brand">
            <img src="https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png" alt="Logo" class="header-logo">
            <span class="header-title">Admin - Femmes</span>
        </a>
        <a href="admin.html" class="nav-btn">⬅️ Retour Admin</a>
    </header>

    <div class="container">
        <div class="hero-banner">
            <h1>👩 Gestion des Profils Féminins</h1>
            <p>Liste de toutes les femmes inscrites sur la plateforme</p>
        </div>
        <div id="womenGrid" class="profiles-grid">
            <p style="text-align:center; grid-column:1/-1; font-weight:bold; color:#0D47A1;">Chargement des profils...</p>
        </div>
    </div>

    <script type="module">
        import { auth, rtdb } from "./love-bebe-service.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { ref, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        onAuthStateChanged(auth, async (user) => {
            if (!user) return window.location.href = "connexion.html";
            
            const grid = document.getElementById('womenGrid');
            try {
                const snapshot = await get(ref(rtdb, 'users'));
                if (!snapshot.exists()) {
                    grid.innerHTML = "<p style='text-align:center; grid-column:1/-1;'>Aucun profil trouvé.</p>";
                    return;
                }
                grid.innerHTML = "";
                const users = snapshot.val();
                let count = 0;

                Object.keys(users).forEach(uid => {
                    const u = users[uid];
                    const gender = u.gender ? u.gender.toLowerCase() : '';
                    if (!gender.includes('fémin') && !gender.includes('femme')) return;

                    count++;
                    const media = u.profileMediaUrl || u.capturedPhotos?.[0] || 'https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png';
                    const card = document.createElement('div');
                    card.className = 'profile-card';
                    card.innerHTML = `
                        <div>
                            <img src="${media}" class="profile-media" alt="Profil">
                            <div class="profile-content">
                                <div class="profile-name">${u.fullName || 'Nom inconnu'}</div>
                                <div class="profile-detail">📍 ${u.city || 'N/A'}, ${u.country || 'N/A'}</div>
                                <div class="profile-detail">💍 Statut : ${u.maritalStatus || 'N/A'}</div>
                                <div class="profile-detail">📧 Email : ${u.email || 'N/A'}</div>
                            </div>
                        </div>
                        <div style="padding: 15px;">
                            <button class="btn-delete" onclick="deleteUser('${uid}')">🗑️ Supprimer le profil</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                if (count === 0) grid.innerHTML = "<p style='text-align:center; grid-column:1/-1;'>Aucun profil féminin enregistré.</p>";
            } catch (err) {
                console.error(err);
            }
        });

        window.deleteUser = async (uid) => {
            if (confirm("Voulez-vous vraiment supprimer ce profil ?")) {
                await remove(ref(rtdb, `users/${uid}`));
                alert("Profil supprimé avec succès !");
                window.location.reload();
            }
        };
    </script>
</body>
</html>
