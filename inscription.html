<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Bébé - Inscription</title>
    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-gold: #FFA500;
            --deep-red: #D32F2F;
            --dark-red: #B71C1C;
            --accent-blue: #0D47A1;
        }
        body {
            background: linear-gradient(135deg, var(--primary-gold) 0%, var(--dark-gold) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #FFFFFF;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 520px;
            border: 4px solid var(--primary-gold);
            box-sizing: border-box;
        }
        .logo-container { text-align: center; margin-bottom: 15px; }
        .logo-wrapper {
            width: 90px; height: 90px; margin: 0 auto; border-radius: 50%;
            background: #fff; border: 3px solid var(--primary-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .logo-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        h2 { text-align: center; color: var(--deep-red); text-transform: uppercase; margin-bottom: 20px; font-size: 1.4rem; }
        label { display: block; margin-top: 12px; font-weight: bold; color: var(--accent-blue); font-size: 13px; }
        input, select { width: 100%; padding: 11px; margin-top: 5px; border: 2px solid #E0E0E0; border-radius: 8px; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: var(--deep-red); }
        .phone-container { display: flex; gap: 8px; margin-top: 5px; }
        .phone-container select { width: 45%; margin-top: 0; }
        .phone-container input { width: 55%; margin-top: 0; }
        .password-container { position: relative; }
        .password-container input { padding-right: 40px; }
        .toggle-password { position: absolute; right: 12px; top: 55%; transform: translateY(-50%); cursor: pointer; }
        .terms-container { display: flex; align-items: flex-start; gap: 10px; margin-top: 15px; font-size: 13px; }
        .terms-container input { width: 18px; height: 18px; accent-color: var(--deep-red); cursor: pointer; }
        button[type="submit"] {
            background: linear-gradient(to right, var(--deep-red), var(--dark-red));
            color: #FFFFFF; border: none; padding: 13px; width: 100%;
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px;
        }
        .switch-link { text-align: center; margin-top: 18px; font-size: 14px; }
        .switch-link a { color: var(--accent-blue); font-weight: bold; text-decoration: underline; }
        .error-msg { color: var(--deep-red); font-size: 13px; text-align: center; margin-top: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-container">
            <div class="logo-wrapper">
                <img src="https://i.postimg.cc/760BWBjs/file-00000000740082109d651397d9fd65b6.png" alt="Logo Love Bébé" crossorigin="anonymous">
            </div>
        </div>

        <h2>Inscription Love Bébé</h2>

        <form id="registerForm">
            <label>Nom complet :</label>
            <input type="text" id="fullName" required placeholder="Ex: Kouassi Jean">

            <label>Genre / Sexe :</label>
            <select id="gender" required>
                <option value="">Sélectionnez votre sexe</option>
                <option value="Masculin">Masculin (Homme)</option>
                <option value="Féminin">Féminin (Femme)</option>
            </select>

            <label>Numéro de Téléphone (WhatsApp) :</label>
            <div class="phone-container">
                <select id="countryCode" required>
                    <option value="+229">🇧🇯 Bénin (+229)</option>
                    <option value="+225">🇨🇮 Côte d'Ivoire (+225)</option>
                    <option value="+33">🇫🇷 France (+33)</option>
                </select>
                <input type="tel" id="phoneNumber" required placeholder="97 00 00 00">
            </div>

            <label>Ville :</label>
            <input type="text" id="city" required placeholder="Ex: Cotonou">

            <label>Pays :</label>
            <input type="text" id="countryInput" required placeholder="Ex: Bénin">

            <label>Statut Matrimonial :</label>
            <select id="maritalStatus" required>
                <option value="Célibataire sans enfant">Célibataire sans enfant</option>
                <option value="Célibataire avec enfant(s)">Célibataire avec enfant(s)</option>
                <option value="Marié(e)">Marié(e)</option>
            </select>

            <label>Âge (minimum 18 ans) :</label>
            <input type="number" id="age" min="18" required placeholder="Votre âge">

            <label>Email :</label>
            <input type="email" id="regEmail" required placeholder="exemple@domaine.com">

            <label>Mot de passe :</label>
            <div class="password-container">
                <input type="password" id="regPassword" required placeholder="••••••••">
                <span class="toggle-password" onclick="togglePasswordVisibility('regPassword', this)">👁️</span>
            </div>

            <div class="terms-container">
                <input type="checkbox" id="acceptTerms" required>
                <label for="acceptTerms" style="display:inline; margin-top:0; font-weight:normal;">
                    J'accepte les conditions d'utilisation.
                </label>
            </div>

            <button type="submit" id="btnRegister">S'inscrire</button>
            <div id="regError" class="error-msg"></div>
        </form>

        <div class="switch-link">
            <span>Déjà inscrit ?</span> <a href="connexion.html">Se connecter</a>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(fieldId, iconElement) {
            const field = document.getElementById(fieldId);
            field.type = field.type === "password" ? "text" : "password";
            iconElement.textContent = field.type === "password" ? "👁️" : "🙈";
        }
    </script>

    <script type="module">
        import { auth, database } from "./love-bebe-service.js";
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const registerForm = document.getElementById('registerForm');
        const regError = document.getElementById('regError');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            regError.textContent = "";
            const btnRegister = document.getElementById('btnRegister');

            try {
                const ageInput = parseInt(document.getElementById('age').value);
                if (isNaN(ageInput) || ageInput < 18) {
                    regError.textContent = "Inscription refusée : Vous devez avoir au moins 18 ans.";
                    return;
                }

                if (!document.getElementById('acceptTerms').checked) {
                    regError.textContent = "Vous devez accepter les conditions d'utilisation.";
                    return;
                }

                btnRegister.disabled = true;
                btnRegister.textContent = "Création du compte...";

                const email = document.getElementById('regEmail').value.trim();
                const password = document.getElementById('regPassword').value.trim();
                const fullPhone = document.getElementById('countryCode').value + " " + document.getElementById('phoneNumber').value.trim();

                const cred = await createUserWithEmailAndPassword(auth, email, password);
                const user = cred.user;

                await set(ref(database, `users/${user.uid}`), {
                    fullName: document.getElementById('fullName').value.trim(),
                    gender: document.getElementById('gender').value,
                    phone: fullPhone,
                    city: document.getElementById('city').value.trim(),
                    country: document.getElementById('countryInput').value.trim(),
                    maritalStatus: document.getElementById('maritalStatus').value,
                    age: ageInput,
                    email: user.email,
                    createdAt: new Date().toISOString()
                });

                window.location.href = "index.html";
            } catch (err) {
                regError.textContent = "Erreur d'inscription : " + err.message;
            } finally {
                btnRegister.disabled = false;
                btnRegister.textContent = "S'inscrire";
            }
        });
    </script>
</body>
</html>
